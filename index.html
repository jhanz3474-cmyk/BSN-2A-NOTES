<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BSN 2A NOTES</title>

<style>

/* =========================
   GLOBAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f4ed;
    color: #29251f;
}


/* =========================
   USERNAME SCREEN
========================= */

#usernameScreen {

    position: fixed;

    inset: 0;

    background: #f7f4ed;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 9999;
}


.loginBox {

    width: min(420px, 90%);

    background: white;

    padding: 40px;

    border-radius: 20px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.12);

    text-align: center;
}


.logo {

    width: 75px;

    height: 75px;

    border-radius: 20px;

    background: #dcebdc;

    display: flex;

    justify-content: center;

    align-items: center;

    margin: auto auto 20px;

    font-size: 16px;

    font-weight: bold;

    color: #4f7859;
}


.loginBox h1 {

    margin-bottom: 8px;

}


.loginBox p {

    color: #777;

}


input,
textarea {

    width: 100%;

    border: 1px solid #ddd5c8;

    border-radius: 10px;

    padding: 12px;

    font-size: 15px;

    outline: none;

}


textarea {

    min-height: 250px;

    resize: vertical;

    line-height: 1.6;
}


button {

    border: none;

    border-radius: 10px;

    padding: 11px 16px;

    cursor: pointer;

    font-size: 14px;
}


.primary {

    background: #557a5d;

    color: white;
}


.primary:hover {

    opacity: .9;
}


/* =========================
   APP
========================= */

#app {

    display: none;

    min-height: 100vh;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {

    position: fixed;

    left: 0;

    top: 0;

    bottom: 0;

    width: 240px;

    background: #eee8dc;

    padding: 25px 15px;
}


.brand {

    font-size: 21px;

    font-weight: bold;

    padding: 10px 15px 30px;

    display: flex;

    align-items: center;

    gap: 10px;
}


.brandLogo {

    display: inline-flex;

    width: 42px;

    height: 42px;

    border-radius: 12px;

    background: #d4e7d6;

    color: #4e7757;

    align-items: center;

    justify-content: center;

    font-size: 11px;

    font-weight: bold;

    text-align: center;
}


.nav button {

    display: block;

    width: 100%;

    text-align: left;

    background: transparent;

    margin-bottom: 5px;

    color: #514c45;
}


.nav button:hover,
.nav button.active {

    background: #ddd5c8;
}


/* =========================
   MAIN
========================= */

.main {

    margin-left: 240px;

    padding: 30px;

    min-height: 100vh;
}


.topbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 35px;

    gap: 20px;
}


.topbar h1 {

    font-family: Georgia, serif;

    font-size: 40px;

    margin: 0;
}


.userArea {

    display: flex;

    align-items: center;

    gap: 10px;

    flex-wrap: wrap;
}


.status {

    color: #63836a;

    font-size: 14px;
}


.adminBadge {

    display: none;

    background: #dcebdc;

    color: #4f7859;

    padding: 7px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;
}


#adminButton {

    background: #e3dfd5;

    color: #514c45;
}


/* =========================
   SECTIONS
========================= */

.section {

    display: none;
}


.section.active {

    display: block;
}


/* =========================
   ACTIONS
========================= */

.actions {

    display: flex;

    gap: 10px;

    margin-bottom: 20px;
}


/* =========================
   CARDS
========================= */

.cards {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(300px, 1fr)
        );

    gap: 18px;

    width: 100%;
}


.card {

    background: #f4eee3;

    border: 1px solid #dfd6c7;

    border-radius: 15px;

    padding: 25px;

    min-height: 170px;

    cursor: pointer;

    transition: .15s;

    width: 100%;

    overflow: hidden;
}


.card:hover {

    transform: translateY(-2px);

    box-shadow:
        0 7px 20px rgba(0,0,0,.07);
}


.card h2 {

    margin: 0 0 12px;

    font-family: Georgia, serif;

    word-break: break-word;
}


/*
   IMPORTANT:
   Keeps the note text directly
   below the title instead of
   appearing on the far right.
*/

.cardText {

    color: #716b62;

    line-height: 1.6;

    white-space: pre-wrap;

    overflow-wrap: anywhere;

    word-break: break-word;

    width: 100%;

    display: block;

    text-align: left;
}


/* =========================
   BUTTONS
========================= */

.editBtn {

    background: #e3dfd5;

    color: #514c45;

    margin-right: 5px;
}


.deleteBtn {

    background: #ead1d1;

    color: #963f3f;
}


/* =========================
   MODALS
========================= */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.45);

    z-index: 1000;

    justify-content: center;

    align-items: center;

    padding: 20px;
}


.modalBox {

    width: min(750px, 95%);

    max-height: 90vh;

    overflow-y: auto;

    background: #fffdf8;

    border-radius: 18px;

    padding: 30px;
}


.modalBox h2 {

    margin-top: 0;

    font-family: Georgia, serif;
}


.modalActions {

    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 15px;
}


.closeBtn {

    background: #e8e3da;
}


/* =========================
   PEOPLE
========================= */

.online {

    display: flex;

    align-items: center;

    gap: 6px;

    color: #557a5d;
}


.dot {

    width: 8px;

    height: 8px;

    background: #5c9b66;

    border-radius: 50%;
}


/* =========================
   MOBILE
========================= */

@media(max-width: 700px) {

    .sidebar {

        width: 70px;

        padding: 15px 8px;
    }


    .brand {

        padding: 10px 5px 25px;

        justify-content: center;
    }


    .brandText {

        display: none;
    }


    .main {

        margin-left: 70px;

        padding: 20px;
    }


    .topbar {

        align-items: flex-start;

        flex-direction: column;
    }


    .topbar h1 {

        font-size: 30px;
    }


    .cards {

        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     USERNAME SCREEN
===================================================== -->

<div id="usernameScreen">

    <div class="loginBox">

        <div class="logo">

            BSN<br>2A

        </div>


        <h1>

            BSN 2A NOTES

        </h1>


        <p>

            Enter your name to continue

        </p>


        <input
            id="usernameInput"
            placeholder="Your name"
            autocomplete="off"
        >


        <br>
        <br>


        <button
            class="primary"
            onclick="enterSite()"
        >

            Enter

        </button>

    </div>

</div>



<!-- =====================================================
     MAIN APP
===================================================== -->

<div id="app">


    <!-- SIDEBAR -->

    <aside class="sidebar">


        <div class="brand">


            <span class="brandLogo">

                BSN<br>2A

            </span>


            <span class="brandText">

                BSN 2A

            </span>


        </div>



        <div class="nav">


            <button
                class="active"
                onclick="showSection('notes', this)"
            >

                📝 Notes

            </button>


            <button
                onclick="showSection('tasks', this)"
            >

                ☑️ Tasks

            </button>


            <button
                onclick="showSection('people', this)"
            >

                👥 People

            </button>


        </div>


    </aside>



    <!-- MAIN -->

    <main class="main">


        <div class="topbar">


            <h1 id="pageTitle">

                Notes

            </h1>


            <div class="userArea">


                <span class="status">

                    👤
                    <span id="currentUser"></span>

                </span>


                <span
                    id="adminBadge"
                    class="adminBadge"
                >

                    ADMIN

                </span>


                <button
                    id="adminButton"
                    onclick="adminLogin()"
                >

                    🔒 Admin

                </button>


            </div>


        </div>



        <!-- =================================================
             NOTES
        ================================================= -->

        <section
            id="notes"
            class="section active"
        >


            <div
                class="actions"
            >

                <button
                    class="primary"
                    onclick="openNoteEditor()"
                >

                    + Add Note

                </button>

            </div>


            <div
                id="notesList"
                class="cards"
            >

            </div>


        </section>



        <!-- =================================================
             TASKS
        ================================================= -->

        <section
            id="tasks"
            class="section"
        >


            <div
                class="actions"
            >

                <button
                    class="primary"
                    onclick="openTaskEditor()"
                >

                    + Add Task

                </button>

            </div>


            <div
                id="tasksList"
                class="cards"
            >

            </div>


        </section>



        <!-- =================================================
             PEOPLE
        ================================================= -->

        <section
            id="people"
            class="section"
        >


            <h2>

                Active People

            </h2>


            <div
                id="peopleList"
                class="cards"
            >

            </div>


        </section>


    </main>

</div>



<!-- =====================================================
     NOTE MODAL
===================================================== -->

<div
    id="noteModal"
    class="modal"
>


    <div class="modalBox">


        <h2 id="noteModalTitle">

            New Note

        </h2>


        <input
            id="noteTitle"
            placeholder="Note title"
        >


        <br>
        <br>


        <textarea
            id="noteText"
            placeholder="Write your note here..."
        ></textarea>


        <div class="modalActions">


            <button
                class="closeBtn"
                onclick="closeModal('noteModal')"
            >

                Cancel

            </button>


            <button
                class="primary"
                onclick="saveNote()"
            >

                Save

            </button>


        </div>


    </div>

</div>



<!-- =====================================================
     TASK MODAL
===================================================== -->

<div
    id="taskModal"
    class="modal"
>


    <div class="modalBox">


        <h2 id="taskModalTitle">

            New Task

        </h2>


        <input
            id="taskTitle"
            placeholder="Task title"
        >


        <br>
        <br>


        <textarea
            id="taskText"
            placeholder="Task details..."
        ></textarea>


        <div class="modalActions">


            <button
                class="closeBtn"
                onclick="closeModal('taskModal')"
            >

                Cancel

            </button>


            <button
                class="primary"
                onclick="saveTask()"
            >

                Save

            </button>


        </div>


    </div>

</div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =========================
   FIREBASE IMPORTS
========================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    set,
    update,
    remove,
    onValue,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyA3IzXz0upKaOBSszJiMRBaKYGB4ajt24A",

    authDomain:
        "bsn-2a-notes.firebaseapp.com",

    databaseURL:
        "https://bsn-2a-notes-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "bsn-2a-notes",

    storageBucket:
        "bsn-2a-notes.firebasestorage.app",

    messagingSenderId:
        "991210260962",

    appId:
        "1:991210260962:web:8f6a886c7478be096991bb",

    measurementId:
        "G-WNTP9GZJ4B"

};



const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


const auth =
    getAuth(app);



/* =====================================================
   ADMIN
===================================================== */

/*
   IMPORTANT:

   This is the admin password you requested.

   Everyone starts as a normal viewer.
*/

const ADMIN_PASSWORD =
    "supperlol123123";


let isAdmin = false;


let editingNoteId = null;


let editingTaskId = null;



/* =====================================================
   USERNAME
===================================================== */

window.enterSite = function () {


    const input =
        document.getElementById(
            "usernameInput"
        );


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "Please enter your name."
        );

        return;
    }


    localStorage.setItem(
        "bsnUsername",
        name
    );


    document
        .getElementById(
            "usernameScreen"
        )
        .style.display = "none";


    document
        .getElementById(
            "app"
        )
        .style.display = "block";


    document
        .getElementById(
            "currentUser"
        )
        .textContent = name;


    updatePresence();

};



/* =====================================================
   ADMIN LOGIN
===================================================== */

window.adminLogin = function () {


    /*
       If already admin,
       don't ask again.
    */

    if (isAdmin) {

        alert(
            "You are already in Admin Mode 🔓"
        );

        return;
    }


    const password =
        prompt(
            "Enter Admin Password:"
        );


    if (
        password ===
        ADMIN_PASSWORD
    ) {


        isAdmin = true;


        document
            .getElementById(
                "adminButton"
            )
            .textContent =
            "🔓 Admin Mode";


        document
            .getElementById(
                "adminBadge"
            )
            .style.display =
            "inline-block";


        /*
           Refresh the cards so
           edit/delete buttons appear.
        */

        loadNotes();

        loadTasks();


        alert(
            "Admin access granted! 🔓"
        );


    } else {


        alert(
            "Incorrect admin password ❌"
        );

    }

};



/* =====================================================
   ADMIN CHECK
===================================================== */

function requireAdmin() {


    if (!isAdmin) {


        alert(
            "🔒 Admin access required.\n\n" +
            "Click the 🔒 Admin button first."
        );


        return false;

    }


    return true;

}



/* =====================================================
   FIREBASE ANONYMOUS LOGIN
===================================================== */

onAuthStateChanged(
    auth,
    async function(user) {


        if (!user) {


            try {

                await signInAnonymously(
                    auth
                );

            }

            catch(error) {

                console.error(
                    error
                );

            }


            return;

        }


        updatePresence();

    }
);



/* =====================================================
   NAVIGATION
===================================================== */

window.showSection =
function(section, button) {


    document
        .querySelectorAll(
            ".section"
        )
        .forEach(
            function(element) {

                element.classList
                    .remove("active");

            }
        );


    document
        .getElementById(section)
        .classList
        .add("active");


    document
        .querySelectorAll(
            ".nav button"
        )
        .forEach(
            function(element) {

                element.classList
                    .remove("active");

            }
        );


    button.classList
        .add("active");


    const titles = {

        notes: "Notes",

        tasks: "Tasks",

        people: "People"

    };


    document
        .getElementById(
            "pageTitle"
        )
        .textContent =
        titles[section];

};



/* =====================================================
   NOTES
===================================================== */

const notesRef =
    ref(
        db,
        "notes"
    );



function loadNotes() {


    onValue(
        notesRef,
        function(snapshot) {


            const data =
                snapshot.val() || {};


            const list =
                document
                    .getElementById(
                        "notesList"
                    );


            list.innerHTML = "";


            const entries =
                Object.entries(data);


            if (
                entries.length === 0
            ) {


                list.innerHTML = `

                    <div class="card">

                        <h2>
                            No Notes Yet
                        </h2>

                        <div class="cardText">

                            ${
                                isAdmin
                                ? "Click + Add Note to create one."
                                : "No notes have been added yet."
                            }

                        </div>

                    </div>

                `;


                return;

            }



            entries.forEach(
                function([id, note]) {


                    const card =
                        document
                            .createElement(
                                "div"
                            );


                    card.className =
                        "card";



                    const adminButtons =
                        isAdmin

                        ? `

                            <br>

                            <button
                                class="editBtn"
                                onclick="
                                    event.stopPropagation();
                                    editNote('${id}');
                                "
                            >

                                ✏️ Edit

                            </button>


                            <button
                                class="deleteBtn"
                                onclick="
                                    event.stopPropagation();
                                    deleteNote('${id}');
                                "
                            >

                                🗑️ Delete

                            </button>

                        `

                        : "";



                    card.innerHTML = `

                        <h2>

                            ${escapeHTML(
                                note.title ||
                                "Untitled"
                            )}

                        </h2>


                        <div class="cardText">

                            ${escapeHTML(
                                note.text ||
                                ""
                            )}

                        </div>


                        ${adminButtons}

                    `;



                    /*
                       Clicking the card opens
                       the note.

                       Normal users can READ.
                       Admin can EDIT.
                    */

                    card.onclick =
                        function() {

                            openNote(
                                id,
                                note
                            );

                        };



                    list.appendChild(
                        card
                    );

                }
            );

        }
    );

}


loadNotes();



/* =====================================================
   OPEN NOTE
===================================================== */

window.openNote =
function(id, note) {


    editingNoteId =
        id;


    document
        .getElementById(
            "noteModalTitle"
        )
        .textContent =
        note.title ||
        "Note";


    document
        .getElementById(
            "noteTitle"
        )
        .value =
        note.title ||
        "";


    document
        .getElementById(
            "noteText"
        )
        .value =
        note.text ||
        "";



    /*
       Normal user:

       READ ONLY
    */

    document
        .getElementById(
            "noteTitle"
        )
        .disabled =
        !isAdmin;


    document
        .getElementById(
            "noteText"
        )
        .disabled =
        !isAdmin;



    document
        .querySelector(
            "#noteModal .primary"
        )
        .style.display =
        isAdmin
        ? "block"
        : "none";



    document
        .getElementById(
            "noteModal"
        )
        .style.display =
        "flex";

};



/* =====================================================
   ADD NOTE
===================================================== */

window.openNoteEditor =
function() {


    if (
        !requireAdmin()
    ) return;


    editingNoteId =
        null;


    document
        .getElementById(
            "noteModalTitle"
        )
        .textContent =
        "New Note";


    document
        .getElementById(
            "noteTitle"
        )
        .value = "";


    document
        .getElementById(
            "noteText"
        )
        .value = "";


    document
        .getElementById(
            "noteTitle"
        )
        .disabled = false;


    document
        .getElementById(
            "noteText"
        )
        .disabled = false;


    document
        .querySelector(
            "#noteModal .primary"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "noteModal"
        )
        .style.display =
        "flex";

};



/* =====================================================
   EDIT NOTE
===================================================== */

window.editNote =
function(id) {


    if (
        !requireAdmin()
    ) return;


    onValue(
        ref(
            db,
            "notes/" + id
        ),

        function(snapshot) {


            const note =
                snapshot.val();


            if (note) {

                openNote(
                    id,
                    note
                );

            }

        },

        {
            onlyOnce: true
        }

    );

};



/* =====================================================
   SAVE NOTE
===================================================== */

window.saveNote =
async function() {


    if (
        !requireAdmin()
    ) return;


    const title =
        document
            .getElementById(
                "noteTitle"
            )
            .value
            .trim();


    const text =
        document
            .getElementById(
                "noteText"
            )
            .value
            .trim();



    if (!title) {

        alert(
            "Please enter a title."
        );

        return;

    }



    try {


        if (editingNoteId) {


            await update(

                ref(
                    db,
                    "notes/" +
                    editingNoteId
                ),

                {

                    title: title,

                    text: text,

                    updatedAt:
                        serverTimestamp()

                }

            );


        }

        else {


            const newNote =
                push(notesRef);


            await set(

                newNote,

                {

                    title: title,

                    text: text,

                    createdAt:
                        serverTimestamp()

                }

            );

        }


        closeModal(
            "noteModal"
        );


    }

    catch(error) {


        console.error(
            error
        );


        alert(
            "Unable to save the note."
        );

    }

};



/* =====================================================
   DELETE NOTE
===================================================== */

window.deleteNote =
async function(id) {


    if (
        !requireAdmin()
    ) return;


    const confirmed =
        confirm(
            "Are you sure you want to delete this note?"
        );


    if (!confirmed)
        return;



    try {


        await remove(

            ref(
                db,
                "notes/" +
                id
            )

        );


    }

    catch(error) {


        console.error(
            error
        );


        alert(
            "Unable to delete the note."
        );

    }

};



/* =====================================================
   TASKS
===================================================== */

const tasksRef =
    ref(
        db,
        "tasks"
    );



function loadTasks() {


    onValue(
        tasksRef,
        function(snapshot) {


            const data =
                snapshot.val() || {};


            const list =
                document
                    .getElementById(
                        "tasksList"
                    );


            list.innerHTML = "";


            const entries =
                Object.entries(data);



            if (
                entries.length === 0
            ) {


                list.innerHTML = `

                    <div class="card">

                        <h2>
                            No Tasks Yet
                        </h2>

                        <div class="cardText">

                            ${
                                isAdmin
                                ? "Click + Add Task to create one."
                                : "No tasks have been added yet."
                            }

                        </div>

                    </div>

                `;


                return;

            }



            entries.forEach(
                function([id, task]) {


                    const card =
                        document
                            .createElement(
                                "div"
                            );


                    card.className =
                        "card";



                    const adminButtons =
                        isAdmin

                        ? `

                            <br>

                            <button
                                class="editBtn"
                                onclick="
                                    event.stopPropagation();
                                    editTask('${id}');
                                "
                            >

                                ✏️ Edit

                            </button>


                            <button
                                class="deleteBtn"
                                onclick="
                                    event.stopPropagation();
                                    deleteTask('${id}');
                                "
                            >

                                🗑️ Delete

                            </button>

                        `

                        : "";



                    card.innerHTML = `

                        <h2>

                            ${escapeHTML(
                                task.title ||
                                "Untitled"
                            )}

                        </h2>


                        <div class="cardText">

                            ${escapeHTML(
                                task.text ||
                                ""
                            )}

                        </div>


                        ${adminButtons}

                    `;



                    card.onclick =
                        function() {

                            openTask(
                                id,
                                task
                            );

                        };



                    list.appendChild(
                        card
                    );

                }
            );

        }
    );

}


loadTasks();



/* =====================================================
   OPEN TASK
===================================================== */

window.openTask =
function(id, task) {


    editingTaskId =
        id;


    document
        .getElementById(
            "taskModalTitle"
        )
        .textContent =
        task.title ||
        "Task";


    document
        .getElementById(
            "taskTitle"
        )
        .value =
        task.title ||
        "";


    document
        .getElementById(
            "taskText"
        )
        .value =
        task.text ||
        "";



    document
        .getElementById(
            "taskTitle"
        )
        .disabled =
        !isAdmin;


    document
        .getElementById(
            "taskText"
        )
        .disabled =
        !isAdmin;


    document
        .querySelector(
            "#taskModal .primary"
        )
        .style.display =
        isAdmin
        ? "block"
        : "none";


    document
        .getElementById(
            "taskModal"
        )
        .style.display =
        "flex";

};



/* =====================================================
   ADD TASK
===================================================== */

window.openTaskEditor =
function() {


    if (
        !requireAdmin()
    ) return;


    editingTaskId =
        null;


    document
        .getElementById(
            "taskModalTitle"
        )
        .textContent =
        "New Task";


    document
        .getElementById(
            "taskTitle"
        )
        .value = "";


    document
        .getElementById(
            "taskText"
        )
        .value = "";


    document
        .getElementById(
            "taskTitle"
        )
        .disabled = false;


    document
        .getElementById(
            "taskText"
        )
        .disabled = false;


    document
        .querySelector(
            "#taskModal .primary"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "taskModal"
        )
        .style.display =
        "flex";

};



/* =====================================================
   EDIT TASK
===================================================== */

window.editTask =
function(id) {


    if (
        !requireAdmin()
    ) return;


    onValue(

        ref(
            db,
            "tasks/" +
            id
        ),

        function(snapshot) {


            const task =
                snapshot.val();


            if (task) {

                openTask(
                    id,
                    task
                );

            }

        },

        {
            onlyOnce: true
        }

    );

};



/* =====================================================
   SAVE TASK
===================================================== */

window.saveTask =
async function() {


    if (
        !requireAdmin()
    ) return;


    const title =
        document
            .getElementById(
                "taskTitle"
            )
            .value
            .trim();


    const text =
        document
            .getElementById(
                "taskText"
            )
            .value
            .trim();



    if (!title) {

        alert(
            "Please enter a task title."
        );

        return;

    }



    try {


        if (editingTaskId) {


            await update(

                ref(
                    db,
                    "tasks/" +
                    editingTaskId
                ),

                {

                    title: title,

                    text: text,

                    updatedAt:
                        serverTimestamp()

                }

            );


        }

        else {


            const newTask =
                push(tasksRef);


            await set(

                newTask,

                {

                    title: title,

                    text: text,

                    createdAt:
                        serverTimestamp()

                }

            );

        }


        closeModal(
            "taskModal"
        );


    }

    catch(error) {


        console.error(
            error
        );


        alert(
            "Unable to save the task."
        );

    }

};



/* =====================================================
   DELETE TASK
===================================================== */

window.deleteTask =
async function(id) {


    if (
        !requireAdmin()
    ) return;


    const confirmed =
        confirm(
            "Are you sure you want to delete this task?"
        );


    if (!confirmed)
        return;



    try {


        await remove(

            ref(
                db,
                "tasks/" +
                id
            )

        );


    }

    catch(error) {


        console.error(
            error
        );


        alert(
            "Unable to delete the task."
        );

    }

};



/* =====================================================
   PEOPLE / ACTIVE USERS
===================================================== */

const presenceRef =
    ref(
        db,
        "presence"
    );



async function updatePresence() {


    const username =
        localStorage.getItem(
            "bsnUsername"
        );


    const user =
        auth.currentUser;


    if (
        !user ||
        !username
    ) return;



    await set(

        ref(
            db,
            "presence/" +
            user.uid
        ),

        {

            name: username,

            online: true,

            lastSeen:
                serverTimestamp()

        }

    );

}



onValue(

    presenceRef,

    function(snapshot) {


        const data =
            snapshot.val() || {};


        const list =
            document
                .getElementById(
                    "peopleList"
                );


        list.innerHTML = "";


        const people =
            Object.values(data)
                .filter(
                    function(person) {

                        return person.online;

                    }
                );



        if (
            people.length === 0
        ) {


            list.innerHTML = `

                <div class="card">

                    <h2>
                        No active people
                    </h2>

                </div>

            `;


            return;

        }



        people.forEach(
            function(person) {


                const card =
                    document
                        .createElement(
                            "div"
                        );


                card.className =
                    "card";


                card.innerHTML = `

                    <h2>

                        👤
                        ${escapeHTML(
                            person.name
                        )}

                    </h2>


                    <div class="online">

                        <span class="dot"></span>

                        Active

                    </div>

                `;


                list.appendChild(
                    card
                );

            }
        );

    }

);



/* =====================================================
   MODAL CLOSE
===================================================== */

window.closeModal =
function(id) {


    document
        .getElementById(id)
        .style.display =
        "none";

};



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

   REMEMBER USERNAME
===================================================== */

    );


if (savedUsername) {

        .getElementById(

        )
