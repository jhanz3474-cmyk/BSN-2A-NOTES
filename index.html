<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BSN 2A NOTES</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

/* =========================
   GLOBAL
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f4ed;
    color: #333;
}

button,
input,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
    border: none;
}

button:active {
    transform: scale(.98);
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;

    width: 240px;
    height: 100vh;

    background: #eee8dc;

    padding: 28px 16px;

    border-right: 1px solid #ddd5c8;

    z-index: 20;
}

.logo {
    margin: 0 10px 40px;

    font-family: Georgia, serif;

    font-size: 24px;
    font-weight: bold;

    line-height: 1.2;
}

.logo-icon {
    color: #4d9b7a;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.nav button {
    width: 100%;

    padding: 14px 16px;

    text-align: left;

    border-radius: 12px;

    background: transparent;

    color: #444;

    font-size: 15px;

    transition: .2s;
}

.nav button:hover {
    background: #ded6c8;
}

.nav button.active {
    background: #dcd4c7;

    color: #378d6b;

    font-weight: bold;
}


/* =========================
   ADMIN BUTTON
========================= */

.admin-status {
    position: absolute;

    left: 16px;
    right: 16px;
    bottom: 25px;
}

.admin-btn {
    width: 100%;

    padding: 12px;

    border-radius: 10px;

    background: #ddd5c8;

    color: #444;

    font-size: 14px;
}

.admin-btn.admin-on {
    background: #4d9b7a;

    color: white;
}


/* =========================
   MAIN
========================= */

.main {
    margin-left: 240px;

    width: calc(100% - 240px);

    min-height: 100vh;
}


/* =========================
   TOPBAR
========================= */

.topbar {
    width: 100%;

    min-height: 65px;

    padding: 0 35px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #faf8f3;

    border-bottom: 1px solid #ddd5c8;
}

.topbar-title {
    font-weight: bold;
}

.user-info {
    color: #777;
}


/* =========================
   PAGE
========================= */

.page {
    width: 100%;

    padding: 38px 40px 60px;
}

.page-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 25px;
}

h1 {
    margin: 0;

    font-family: Georgia, serif;

    font-size: clamp(30px, 4vw, 46px);

    line-height: 1.1;
}


/* =========================
   SECTIONS
========================= */

.section {
    display: none;
}

.section.active {
    display: block;
}


/* =========================
   BUTTONS
========================= */

.add-btn {
    background: #4d9b7a;

    color: white;

    padding: 12px 18px;

    border-radius: 10px;

    font-size: 15px;

    white-space: nowrap;
}

.add-btn:hover {
    background: #3d8465;
}

.small-btn {
    padding: 8px 12px;

    border-radius: 8px;

    background: #ddd5c8;

    color: #444;

    white-space: nowrap;
}

.small-btn:hover {
    background: #ccc2b2;
}

.save-btn {
    background: #4d9b7a;

    color: white;

    padding: 11px 18px;

    border-radius: 8px;
}

.cancel-btn {
    background: #ddd5c8;

    color: #444;

    padding: 11px 18px;

    border-radius: 8px;
}


/* =========================
   NOTES GRID
========================= */

.notes-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(280px, 1fr));

    gap: 20px;

    width: 100%;
}


/* =========================
   NOTE CARD
========================= */

.note-card {
    width: 100%;

    min-height: 210px;

    padding: 24px;

    background: #f1ebdf;

    border: 1px solid #ddd4c5;

    border-radius: 16px;

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;

    overflow-wrap: anywhere;
}

.note-card:hover {
    transform: translateY(-3px);

    box-shadow:
        0 7px 20px rgba(0,0,0,.08);
}

.note-title {
    margin: 0 0 14px;

    font-family: Georgia, serif;

    font-size: 23px;

    font-weight: bold;

    line-height: 1.2;

    color: #333;
}

.note-content {
    margin: 0;

    color: #666;

    font-size: 15px;

    line-height: 1.65;

    white-space: pre-wrap;

    overflow-wrap: anywhere;
}

.card-buttons {
    display: flex;

    gap: 8px;

    margin-top: 20px;
}


/* =========================
   EMPTY
========================= */

.empty {
    width: 100%;

    padding: 60px 25px;

    text-align: center;

    color: #888;

    background: #f1ebdf;

    border: 1px solid #ddd4c5;

    border-radius: 16px;

    grid-column: 1 / -1;
}


/* =========================
   TASKS
========================= */

.task-list {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 12px;
}

.task {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 13px;

    padding: 17px 18px;

    background: #f1ebdf;

    border: 1px solid #ddd4c5;

    border-radius: 13px;
}

.task input[type="checkbox"] {
    width: 18px;
    height: 18px;

    margin: 0;

    flex-shrink: 0;
}

.task-text {
    flex: 1;

    overflow-wrap: anywhere;

    line-height: 1.4;
}

.task.done .task-text {
    text-decoration: line-through;

    opacity: .5;
}


/* =========================
   CHAT
========================= */

.chat-box {
    width: 100%;

    background: #f1ebdf;

    border: 1px solid #ddd4c5;

    border-radius: 16px;

    padding: 20px;
}

.messages {
    width: 100%;

    height: 55vh;

    min-height: 300px;

    overflow-y: auto;

    margin-bottom: 15px;

    padding-right: 5px;
}

.message {
    width: fit-content;

    max-width: 80%;

    padding: 10px 13px;

    margin-bottom: 10px;

    background: #e4dccf;

    border-radius: 10px;

    overflow-wrap: anywhere;
}

.message strong {
    color: #378d6b;
}

.message-time {
    margin-left: 7px;

    font-size: 11px;

    color: #999;
}

.message div {
    margin-top: 4px;

    line-height: 1.4;
}

.chat-input {
    display: flex;

    gap: 8px;

    width: 100%;
}

.chat-input input {
    flex: 1;

    min-width: 0;
}


/* =========================
   INPUTS
========================= */

input,
textarea {
    width: 100%;

    padding: 13px;

    border: 1px solid #d5ccbd;

    border-radius: 9px;

    background: white;

    color: #333;

    font-size: 15px;

    outline: none;
}

input:focus,
textarea:focus {
    border-color: #4d9b7a;

    box-shadow:
        0 0 0 2px rgba(77,155,122,.12);
}

textarea {
    min-height: 280px;

    resize: vertical;

    line-height: 1.65;
}


/* =========================
   MODALS
========================= */

.overlay {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.45);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 100;

    padding: 20px;
}

.overlay.show {
    display: flex;
}

.modal {
    width: min(650px, 100%);

    max-height: 90vh;

    overflow-y: auto;

    padding: 28px;

    background: #faf8f3;

    border-radius: 16px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.2);
}

.modal h2 {
    margin: 0 0 20px;

    font-family: Georgia, serif;
}

.modal input {
    margin-bottom: 15px;
}

.modal-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 15px;
}


/* =========================
   USERNAME
========================= */

.username-box {
    text-align: center;
}

.username-box h2 {
    font-size: 30px;
}

.username-box p {
    color: #777;

    margin-bottom: 20px;
}

.username-box .save-btn {
    width: 100%;

    margin-top: 12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 900px) {

    .sidebar {
        width: 200px;
    }

    .main {
        margin-left: 200px;

        width: calc(100% - 200px);
    }

    .page {
        padding: 30px 25px 50px;
    }

    .topbar {
        padding: 0 25px;
    }
}


@media (max-width: 700px) {

    .sidebar {
        position: fixed;

        width: 70px;

        padding: 20px 8px;
    }

    .logo {
        margin: 0 0 30px;

        text-align: center;

        font-size: 0;
    }

    .logo-icon {
        font-size: 27px;
    }

    .nav button {
        padding: 13px 5px;

        text-align: center;

        font-size: 0;
    }

    .nav button:first-child::after {
        content: "📝";

        font-size: 21px;
    }

    .nav button:nth-child(2)::after {
        content: "☑️";

        font-size: 21px;
    }

    .nav button:nth-child(3)::after {
        content: "💬";

        font-size: 21px;
    }

    .admin-status {
        left: 8px;
        right: 8px;
    }

    .admin-btn {
        padding: 12px 3px;

        font-size: 0;
    }

    .admin-btn::after {
        content: "🔒";

        font-size: 20px;
    }

    .main {
        margin-left: 70px;

        width: calc(100% - 70px);
    }

    .page {
        padding: 25px 15px 40px;
    }

    .topbar {
        min-height: 58px;

        padding: 0 15px;
    }

    .user-info {
        font-size: 13px;
    }

    .page-header {
        align-items: flex-start;

        flex-direction: column;
    }

    .add-btn {
        width: 100%;
    }

    .notes-grid {
        grid-template-columns: 1fr;

        gap: 14px;
    }

    .note-card {
        min-height: 180px;

        padding: 20px;
    }

    .chat-input {
        flex-direction: column;
    }

    .chat-input .save-btn {
        width: 100%;
    }

    .message {
        max-width: 90%;
    }

    .task {
        align-items: flex-start;
    }

    .task .small-btn {
        flex-shrink: 0;
    }
}


@media (max-width: 400px) {

    .sidebar {
        width: 60px;
    }

    .main {
        margin-left: 60px;

        width: calc(100% - 60px);
    }

    .page {
        padding: 20px 10px 35px;
    }

    .topbar {
        padding: 0 10px;
    }

    .topbar-title {
        display: none;
    }

    .note-card {
        padding: 17px;
    }
}

</style>
</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo">

        <span class="logo-icon">
            🌱
        </span>

        <span>
            BSN 2A NOTES
        </span>

    </div>


    <div class="nav">

        <button
            class="active"
            onclick="showSection('notes', this)">

            📝 Notes

        </button>


        <button
            onclick="showSection('tasks', this)">

            ☑️ Tasks

        </button>


        <button
            onclick="showSection('chat', this)">

            💬 Chat

        </button>

    </div>


    <div class="admin-status">

        <button
            id="adminButton"
            class="admin-btn"
            onclick="toggleAdmin()">

            🔒 Admin

        </button>

    </div>

</aside>



<!-- =========================
     MAIN
========================= -->

<main class="main">


    <header class="topbar">

        <div class="topbar-title">

            📚 BSN 2A

        </div>


        <div class="user-info">

            👤

            <span
                id="usernameDisplay">
            </span>

        </div>

    </header>



    <!-- NOTES -->

    <section
        id="notesSection"
        class="section active">

        <div class="page">

            <div class="page-header">

                <h1>
                    Notes
                </h1>


                <button
                    id="addNoteButton"
                    class="add-btn"
                    onclick="openNoteEditor()"
                    style="display:none;">

                    + Add Note

                </button>

            </div>


            <div
                id="notesGrid"
                class="notes-grid">
            </div>

        </div>

    </section>



    <!-- TASKS -->

    <section
        id="tasksSection"
        class="section">

        <div class="page">

            <div class="page-header">

                <h1>
                    Tasks
                </h1>


                <button
                    id="addTaskButton"
                    class="add-btn"
                    onclick="openTaskEditor()"
                    style="display:none;">

                    + Add Task

                </button>

            </div>


            <div
                id="taskList"
                class="task-list">
            </div>

        </div>

    </section>



    <!-- CHAT -->

    <section
        id="chatSection"
        class="section">

        <div class="page">

            <div class="page-header">

                <h1>
                    Chat
                </h1>

            </div>


            <div class="chat-box">

                <div
                    id="messages"
                    class="messages">
                </div>


                <div class="chat-input">

                    <input
                        id="chatInput"
                        type="text"
                        placeholder="Write a message..."
                        maxlength="500"
                        onkeydown="
                            if(event.key === 'Enter')
                            sendMessage()
                        "
                    >


                    <button
                        class="save-btn"
                        onclick="sendMessage()">

                        Send

                    </button>

                </div>

            </div>

        </div>

    </section>

</main>



<!-- =========================
     USERNAME MODAL
========================= -->

<div
    id="usernameOverlay"
    class="overlay">

    <div class="modal username-box">

        <h2>
            Welcome to BSN 2A Notes 👋
        </h2>

        <p>
            Enter your name to continue.
        </p>


        <input
            id="usernameInput"
            type="text"
            placeholder="Your name"
            maxlength="30"
            onkeydown="
                if(event.key === 'Enter')
                saveUsername()
            "
        >


        <button
            class="save-btn"
            onclick="saveUsername()">

            Enter

        </button>

    </div>

</div>



<!-- =========================
     NOTE EDITOR
========================= -->

<div
    id="noteOverlay"
    class="overlay">

    <div class="modal">

        <h2
            id="noteModalTitle">

            Add Note

        </h2>


        <input
            id="noteTitle"
            type="text"
            placeholder="Note title"
            maxlength="100"
        >


        <textarea
            id="noteContent"
            placeholder="Write your note here..."
        ></textarea>


        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closeNoteEditor()">

                Cancel

            </button>


            <button
                class="save-btn"
                onclick="saveNote()">

                Save

            </button>

        </div>

    </div>

</div>



<!-- =========================
     TASK EDITOR
========================= -->

<div
    id="taskOverlay"
    class="overlay">

    <div class="modal">

        <h2>
            Add Task
        </h2>


        <input
            id="taskInput"
            type="text"
            placeholder="Task..."
            maxlength="300"
            onkeydown="
                if(event.key === 'Enter')
                saveTask()
            "
        >


        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closeTaskEditor()">

                Cancel

            </button>


            <button
                class="save-btn"
                onclick="saveTask()">

                Save

            </button>

        </div>

    </div>

</div>



<!-- =========================
     ADMIN PASSWORD
========================= -->

<div
    id="adminOverlay"
    class="overlay">

    <div class="modal username-box">

        <h2>
            🔒 Admin Mode
        </h2>

        <p>
            Enter the admin password.
        </p>


        <input
            id="adminPassword"
            type="password"
            placeholder="Password"
            onkeydown="
                if(event.key === 'Enter')
                checkAdmin()
            "
        >


        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closeAdmin()">

                Cancel

            </button>


            <button
                class="save-btn"
                onclick="checkAdmin()">

                Unlock

            </button>

        </div>

    </div>

</div>



<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyA3IzXz0upKaOBSszJiMRBaKYGB4ajt24",

    authDomain:
        "bsn-2a-notes.firebaseapp.com",

    databaseURL:
        "https://bsn-2a-notes-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "bsn-2a-notes",

    storageBucket:
        "bsn-2a-notes.firebasestorage.app",

    messagingSenderId:
        "991210260962",

    appId:
        "1:991210260962:web:8f6a886c7478be096991bb",

    measurementId:
        "G-WNTP9GZJ4B"
};


firebase.initializeApp(
    firebaseConfig
);

const db =
    firebase.database();



/* =====================================================
   VARIABLES
===================================================== */

let username =
    localStorage.getItem(
        "bsnUsername"
    );

let isAdmin = false;

let editingNoteId = null;



/* =====================================================
   LOAD
===================================================== */

window.addEventListener(
    "load",
    () => {

        if (!username) {

            document
                .getElementById(
                    "usernameOverlay"
                )
                .classList
                .add("show");


            setTimeout(() => {

                document
                    .getElementById(
                        "usernameInput"
                    )
                    .focus();

            }, 200);

        } else {

            document
                .getElementById(
                    "usernameDisplay"
                )
                .textContent =
                username;

        }

    }
);



/* =====================================================
   USERNAME
===================================================== */

function saveUsername() {

    const input =
        document.getElementById(
            "usernameInput"
        );


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "Please enter your name."
        );

        return;
    }


    username = name;


    localStorage.setItem(
        "bsnUsername",
        username
    );


    document
        .getElementById(
            "usernameDisplay"
        )
        .textContent =
        username;


    document
        .getElementById(
            "usernameOverlay"
        )
        .classList
        .remove("show");

}



/* =====================================================
   NAVIGATION
===================================================== */

function showSection(
    section,
    button
) {

    document
        .querySelectorAll(
            ".section"
        )
        .forEach(
            element => {

                element
                    .classList
                    .remove(
                        "active"
                    );

            }
        );


    document
        .querySelectorAll(
            ".nav button"
        )
        .forEach(
            element => {

                element
                    .classList
                    .remove(
                        "active"
                    );

            }
        );


    document
        .getElementById(
            section +
            "Section"
        )
        .classList
        .add("active");


    button
        .classList
        .add("active");

}



/* =====================================================
   ADMIN
===================================================== */

function toggleAdmin() {

    if (isAdmin) {

        isAdmin = false;

        updateAdminUI();

        alert(
            "Admin mode locked."
        );

        return;
    }


    document
        .getElementById(
            "adminOverlay"
        )
        .classList
        .add("show");


    document
        .getElementById(
            "adminPassword"
        )
        .focus();

}



function checkAdmin() {

    const password =
        document
            .getElementById(
                "adminPassword"
            )
            .value;


    if (
        password ===
        "supperlol123123"
    ) {

        isAdmin = true;


        document
            .getElementById(
                "adminOverlay"
            )
            .classList
            .remove("show");


        document
            .getElementById(
                "adminPassword"
            )
            .value = "";


        updateAdminUI();


        alert(
            "Admin mode unlocked 🔓"
        );

    } else {

        alert(
            "Wrong password."
        );

    }

}



function closeAdmin() {

    document
        .getElementById(
            "adminOverlay"
        )
        .classList
        .remove("show");


    document
        .getElementById(
            "adminPassword"
        )
        .value = "";

}



function updateAdminUI() {

    const button =
        document.getElementById(
            "adminButton"
        );


    const addNote =
        document.getElementById(
            "addNoteButton"
        );


    const addTask =
        document.getElementById(
            "addTaskButton"
        );


    if (isAdmin) {

        button.textContent =
            "🔓 Admin ON";

        button.classList.add(
            "admin-on"
        );


        addNote.style.display =
            "inline-block";


        addTask.style.display =
            "inline-block";

    } else {

        button.textContent =
            "🔒 Admin";

        button.classList.remove(
            "admin-on"
        );


        addNote.style.display =
            "none";


        addTask.style.display =
            "none";

    }


    db.ref("notes")
        .once("value")
        .then(snapshot => {

            renderNotes(
                snapshot.val() || {}
            );

        });


    db.ref("tasks")
        .once("value")
        .then(snapshot => {

            renderTasks(
                snapshot.val() || {}
            );

        });

}



/* =====================================================
   NOTES REALTIME
===================================================== */

db.ref("notes").on(
    "value",
    snapshot => {

        renderNotes(
            snapshot.val() || {}
        );

    }
);



function renderNotes(data) {

    const grid =
        document.getElementById(
            "notesGrid"
        );


    grid.innerHTML = "";


    const notes =
        Object.entries(data);


    notes.sort(
        (a, b) => {

            const orderA =
                a[1].order ??
                a[1].createdAt ??
                0;


            const orderB =
                b[1].order ??
                b[1].createdAt ??
                0;


            return orderA - orderB;

        }
    );


    if (
        notes.length === 0
    ) {

        grid.innerHTML = `

            <div class="empty">

                No notes yet.

                ${
                    isAdmin
                    ?
                    " Click + Add Note to create one."
                    :
                    ""
                }

            </div>

        `;

        return;
    }


    notes.forEach(
        ([id, note]) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "note-card";


            card.draggable =
                isAdmin;


            card.dataset.id =
                id;


            card.onclick =
                function(event) {

                    if (
                        event.target
                            .closest(
                                "button"
                            )
                    ) {
                        return;
                    }


                    openNote(
                        id,
                        note
                    );

                };


            /* Drag and drop */

            card.addEventListener(
                "dragstart",
                event => {

                    if (!isAdmin) {

                        event.preventDefault();

                        return;
                    }


                    event.dataTransfer
                        .setData(
                            "text/plain",
                            id
                        );

                }
            );


            card.addEventListener(
                "dragover",
                event => {

                    if (isAdmin) {

                        event.preventDefault();

                    }

                }
            );


            card.addEventListener(
                "drop",
                event => {

                    event.preventDefault();


                    if (!isAdmin) {
                        return;
                    }


                    const draggedId =
                        event.dataTransfer
                            .getData(
                                "text/plain"
                            );


                    reorderNotes(
                        draggedId,
                        id
                    );

                }
            );


            let html = `

                <div class="note-title">

                    ${escapeHTML(
                        note.title ||
                        "Untitled"
                    )}

                </div>


                <div class="note-content">

                    ${escapeHTML(
                        note.content ||
                        ""
                    )}

                </div>

            `;


            if (isAdmin) {

                html += `

                    <div class="card-buttons">

                        <button
                            class="small-btn"
                            type="button"
                            onclick="
                                event.stopPropagation();
                                editNote('${id}');
                            ">

                            ✏️ Edit

                        </button>


                        <button
                            class="small-btn"
                            type="button"
                            onclick="
                                event.stopPropagation();
                                deleteNote('${id}');
                            ">

                            🗑️ Delete

                        </button>

                    </div>

                `;

            }


            card.innerHTML =
                html;


            grid.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   NOTE EDITOR
===================================================== */

function openNoteEditor(
    id = null
) {

    if (!isAdmin) {
        return;
    }


    editingNoteId =
        id;


    const title =
        document.getElementById(
            "noteTitle"
        );


    const content =
        document.getElementById(
            "noteContent"
        );


    if (id) {

        db.ref(
            "notes/" + id
        )
        .once("value")
        .then(snapshot => {

            const note =
                snapshot.val();


            title.value =
                note?.title || "";


            content.value =
                note?.content || "";


            document
                .getElementById(
                    "noteModalTitle"
                )
                .textContent =
                "Edit Note";


            document
                .getElementById(
                    "noteOverlay"
                )
                .classList
                .add("show");

        });


    } else {

        title.value = "";

        content.value = "";


        document
            .getElementById(
                "noteModalTitle"
            )
            .textContent =
            "Add Note";


        document
            .getElementById(
                "noteOverlay"
            )
            .classList
            .add("show");


        title.focus();

    }

}



function editNote(id) {

    openNoteEditor(id);

}



/* =====================================================
   OPEN NOTE
===================================================== */

function openNote(
    id,
    note
) {

    editingNoteId =
        id;


    const title =
        document.getElementById(
            "noteTitle"
        );


    const content =
        document.getElementById(
            "noteContent"
        );


    title.value =
        note.title || "";


    content.value =
        note.content || "";


    document
        .getElementById(
            "noteModalTitle"
        )
        .textContent =
        isAdmin
        ?
        "Edit Note"
        :
        "View Note";


    title.disabled =
        !isAdmin;


    content.disabled =
        !isAdmin;


    document
        .getElementById(
            "noteOverlay"
        )
        .classList
        .add("show");

}



/* =====================================================
   SAVE NOTE
===================================================== */

function saveNote() {

    if (!isAdmin) {
        return;
    }


    const title =
        document
            .getElementById(
                "noteTitle"
            )
            .value
            .trim();


    const content =
        document
            .getElementById(
                "noteContent"
            )
            .value
            .trim();


    if (!title) {

        alert(
            "Please enter a title."
        );

        return;
    }


    if (!content) {

        alert(
            "Please enter some text."
        );

        return;
    }


    if (editingNoteId) {

        db.ref(
            "notes/" +
            editingNoteId
        )
        .update({

            title: title,

            content: content,

            updatedAt:
                Date.now(),

            updatedBy:
                username

        });


    } else {

        const newNote =
            db.ref("notes")
              .push();


        newNote.set({

            title: title,

            content: content,

            createdAt:
                Date.now(),

            updatedAt:
                Date.now(),

            updatedBy:
                username,

            order:
                Date.now()

        });

    }


    closeNoteEditor();

}



/* =====================================================
   CLOSE NOTE
===================================================== */

function closeNoteEditor() {

    document
        .getElementById(
            "noteOverlay"
        )
        .classList
        .remove("show");


    document
        .getElementById(
            "noteTitle"
        )
        .disabled = false;


    document
        .getElementById(
            "noteContent"
        )
        .disabled = false;


    editingNoteId =
        null;

}



/* =====================================================
   DELETE NOTE
===================================================== */

function deleteNote(id) {

    if (!isAdmin) {
        return;
    }


    if (
        confirm(
            "Delete this note permanently?"
        )
    ) {

        db.ref(
            "notes/" + id
        )
        .remove()
        .catch(error => {

            console.error(
                error
            );


            alert(
                "Couldn't delete the note: " +
                error.message
            );

        });

    }

}



/* =====================================================
   REORDER NOTES
===================================================== */

function reorderNotes(
    draggedId,
    targetId
) {

    if (
        !draggedId ||
        !targetId ||
        draggedId === targetId
    ) {
        return;
    }


    db.ref("notes")
        .once("value")
        .then(snapshot => {

            const notes =
                snapshot.val() || {};


            const entries =
                Object.entries(
                    notes
                );


            entries.sort(
                (a, b) =>
                    (a[1].order || 0) -
                    (b[1].order || 0)
            );


            const draggedIndex =
                entries.findIndex(
                    item =>
                        item[0] ===
                        draggedId
                );


            const targetIndex =
                entries.findIndex(
                    item =>
                        item[0] ===
                        targetId
                );


            if (
                draggedIndex === -1 ||
                targetIndex === -1
            ) {
                return;
            }


            const dragged =
                entries.splice(
                    draggedIndex,
                    1
                )[0];


            entries.splice(
                targetIndex,
                0,
                dragged
            );


            const updates = {};


            entries.forEach(
                ([id], index) => {

                    updates[
                        "notes/" +
                        id +
                        "/order"
                    ] = index;

                }
            );


            db.ref()
                .update(
                    updates
                );

        });

}



/* =====================================================
   TASKS REALTIME
===================================================== */

db.ref("tasks").on(
    "value",
    snapshot => {

        renderTasks(
            snapshot.val() || {}
        );

    }
);



/* =====================================================
   RENDER TASKS
===================================================== */

function renderTasks(
    tasks
) {

    const list =
        document.getElementById(
            "taskList"
        );


    list.innerHTML = "";


    const entries =
        Object.entries(
            tasks
        );


    entries.sort(
        (a, b) =>
            (a[1].createdAt || 0) -
            (b[1].createdAt || 0)
    );


    if (
        entries.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                No tasks yet.

            </div>

        `;

        return;
    }


    entries.forEach(
        ([id, task]) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "task" +
                (
                    task.done
                    ?
                    " done"
                    :
                    ""
                );


            /* Checkbox */

            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.checked =
                !!task.done;


            checkbox.addEventListener(
                "change",
                () => {

                    toggleTask(id);

                }
            );


            /* Text */

            const text =
                document.createElement(
                    "div"
                );


            text.className =
                "task-text";


            text.textContent =
                task.text || "";


            div.appendChild(
                checkbox
            );


            div.appendChild(
                text
            );


            /* ADMIN DELETE */

            if (isAdmin) {

                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "small-btn";


                deleteButton.type =
                    "button";


                deleteButton.textContent =
                    "🗑️ Delete";


                deleteButton.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();

                        event.stopPropagation();


                        deleteTask(id);

                    }
                );


                div.appendChild(
                    deleteButton
                );

            }


            list.appendChild(
                div
            );

        }
    );

}



/* =====================================================
   TASK EDITOR
===================================================== */

function openTaskEditor() {

    if (!isAdmin) {
        return;
    }


    document
        .getElementById(
            "taskInput"
        )
        .value = "";


    document
        .getElementById(
            "taskOverlay"
        )
        .classList
        .add("show");


    document
        .getElementById(
            "taskInput"
        )
        .focus();

}



function closeTaskEditor() {

    document
        .getElementById(
            "taskOverlay"
        )
        .classList
        .remove("show");

}



/* =====================================================
   SAVE TASK
===================================================== */

function saveTask() {

    if (!isAdmin) {
        return;
    }


    const input =
        document.getElementById(
            "taskInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        alert(
            "Please enter a task."
        );

        return;
    }


    db.ref("tasks")
        .push({

            text: text,

            done: false,

            createdAt:
                Date.now(),

            createdBy:
                username

        })
        .then(() => {

            closeTaskEditor();

        })
        .catch(error => {

            console.error(
                error
            );


            alert(
                "Couldn't create the task: " +
                error.message
            );

        });

}



/* =====================================================
   TOGGLE TASK
===================================================== */

function toggleTask(id) {

    db.ref(
        "tasks/" +
        id +
        "/done"
    )
    .once("value")
    .then(snapshot => {

        const current =
            !!snapshot.val();


        return db.ref(
            "tasks/" +
            id +
            "/done"
        )
        .set(
            !current
        );

    })
    .catch(error => {

        console.error(
            "Task update failed:",
            error
        );

        alert(
            "Couldn't update the task."
        );

    });

}



/* =====================================================
   DELETE TASK
===================================================== */

function deleteTask(id) {

    if (!isAdmin) {

        alert(
            "You need Admin Mode to delete tasks."
        );

        return;
    }


    if (!id) {

        alert(
            "Task ID not found."
        );

        return;
    }


    if (
        !confirm(
            "Delete this task permanently?"
        )
    ) {
        return;
    }


    db.ref(
        "tasks/" + id
    )
    .remove()
    .then(() => {

        console.log(
            "Task deleted:",
            id
        );

    })
    .catch(error => {

        console.error(
            "Delete failed:",
            error
        );


        alert(
            "Couldn't delete the task: " +
            error.message
        );

    });

}



/* =====================================================
   CHAT
===================================================== */

db.ref("chat").on(
    "value",
    snapshot => {

        renderMessages(
            snapshot.val() || {}
        );

    }
);



function renderMessages(
    messages
) {

    const box =
        document.getElementById(
            "messages"
        );


    box.innerHTML = "";


    const entries =
        Object.entries(
            messages
        );


    entries.sort(
        (a, b) =>
            (a[1].timestamp || 0) -
            (b[1].timestamp || 0)
    );


    entries.forEach(
        ([id, msg]) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "message";


            const time =
                new Date(
                    msg.timestamp ||
                    Date.now()
                )
                .toLocaleTimeString(
                    [],
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit"
                    }
                );


            const name =
                document.createElement(
                    "strong"
                );


            name.textContent =
                msg.user ||
                "Unknown";


            const timeSpan =
                document.createElement(
                    "span"
                );


            timeSpan.className =
                "message-time";


            timeSpan.textContent =
                time;


            const text =
                document.createElement(
                    "div"
                );


            text.textContent =
                msg.text ||
                "";


            div.appendChild(
                name
            );


            div.appendChild(
                timeSpan
            );


            div.appendChild(
                text
            );


            box.appendChild(
                div
            );

        }
    );


    box.scrollTop =
        box.scrollHeight;

}



/* =====================================================
   SEND MESSAGE
===================================================== */

function sendMessage() {

    const input =
        document.getElementById(
            "chatInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    db.ref("chat")
        .push({

            user:
                username ||
                "Anonymous",

            text:
                text,

            timestamp:
                Date.now()

        })
        .then(() => {

            input.value = "";

        })
        .catch(error => {

            console.error(
                error
            );


            alert(
                "Couldn't send message: " +
                error.message
            );

        });

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    text
) {

    if (!text) {
        return "";
    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
