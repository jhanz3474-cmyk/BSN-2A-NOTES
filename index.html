<!DOCTYPE html>
<html>
<head>

    <title>BSN 2A Notes</title>

    <style>

        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f8f6f1;
            color: #302b25;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background: #f1ece2;
            padding: 25px 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .menu {
            padding: 12px;
            margin: 5px 0;
            border-radius: 12px;
            cursor: pointer;
        }

        .menu:hover {
            background: #e2d9cb;
        }

        .active {
            background: #e2d9cb;
            color: #328b6d;
        }


        /* MAIN */

        .main {
            margin-left: 250px;
            padding: 45px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 30px;
        }


        /* NOTES */

        .notes {
            display: grid;
            grid-template-columns: repeat(2, minmax(250px, 1fr));
            gap: 20px;
            max-width: 950px;
        }

        .note {
            background: #f4eee4;
            border: 1px solid #ddd4c6;
            border-radius: 14px;
            padding: 25px;
            min-height: 140px;

            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
        }

        .note h2 {
            margin-top: 0;
            font-size: 21px;
        }

        .note p {
            color: #756c63;
            line-height: 1.6;
            white-space: pre-line;
        }


        /* ADD BUTTON */

        .add-button {
            margin-top: 25px;
            padding: 13px 20px;

            border: 1px dashed #8b9d8f;
            border-radius: 12px;

            background: transparent;

            font-family: Georgia, serif;
            font-size: 15px;

            color: #328b6d;

            cursor: pointer;
        }

        .add-button:hover {
            background: #e9e3d8;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .sidebar {
                width: 160px;
            }

            .main {
                margin-left: 180px;
                padding: 25px;
            }

            .notes {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            🌱 BSN 2A NOTES
        </div>

        <div class="menu active">
            📝 Notes
        </div>

        <div class="menu">
            ☑ Tasks
        </div>

        <div class="menu">
            💬 Chat
        </div>

    </div>


    <!-- MAIN CONTENT -->

    <div class="main">

        <h1>Notes</h1>


        <div class="notes">


            <div class="note">

                <h2>📌 NCM 101</h2>

                <p>
Exam coverage

Important discussions

Review materials
                </p>

            </div>


            <div class="note">

                <h2>📌 NCM 102</h2>

                <p>
Exam coverage

Important topics

Review materials
                </p>

            </div>


            <div class="note">

                <h2>📌 Microbiology</h2>

                <p>
Chapter notes

Important microorganisms

Review materials
                </p>

            </div>


            <div class="note">

                <h2>📌 English</h2>

                <p>
Assignments

Activities

Important reminders
                </p>

            </div>


        </div>


        <button
            class="add-button"
            onclick="addNote()"
        >
            ＋ Add Note
        </button>


    </div>


<script>

    function addNote() {

        let title =
            prompt("Enter the note title:");

        if (!title) {
            return;
        }

        let content =
            prompt("Enter the note:");

        if (!content) {
            return;
        }

        let note =
            document.createElement("div");

        note.className = "note";

        note.innerHTML = `
            <h2>📌 ${title}</h2>
            <p>${content}</p>
        `;

        document
            .querySelector(".notes")
            .appendChild(note);

    }

</script>


</body>
</html>
