<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f6f2e9;color:#1e2b25}
button,input,textarea,select{font:inherit}

.side{
 position:fixed;inset:0 auto 0 0;width:240px;padding:22px 16px;
 background:linear-gradient(#173f2d,#285c43);color:#fff
}
.logo{text-align:center}
.logo b{
 display:flex;width:75px;height:75px;margin:auto;border:4px solid #dcebd7;
 border-radius:20px;align-items:center;justify-content:center
}
.nav button{
 display:block;width:100%;margin:7px 0;padding:12px;border:0;
 border-radius:10px;background:transparent;color:white;text-align:left;cursor:pointer
}
.nav button:hover,.nav .on{background:#ffffff25}

.user{
 position:absolute;bottom:18px;left:16px;right:16px;padding:12px;
 background:#ffffff18;border-radius:12px
}
.online{margin-top:9px;font-size:12px;max-height:115px;overflow:auto}
.dot{
 display:inline-block;width:7px;height:7px;border-radius:50%;
 background:#7ee08d;margin-right:5px
}

.main{margin-left:240px;padding:25px}
.top{display:flex;gap:10px;margin-bottom:20px}
.search{flex:1;padding:12px;border:1px solid #ddd;border-radius:12px}
.btn{
 border:0;border-radius:10px;padding:11px 15px;
 background:#245c43;color:#fff;cursor:pointer
}

.sec{display:none}
.sec.on{display:block}

.hero,.card,.task,.chat{
 background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;
 box-shadow:0 5px 20px #1e322015
}
.hero{background:linear-gradient(110deg,#e4efdc,#f4f2df)}
h1,h2,h3{font-family:Georgia,serif}

.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
 gap:16px
}

.card{
 display:block;
 cursor:default;
 transition:.15s
}

.card[draggable="true"]{
 cursor:grab
}

.card[draggable="true"]:active{
 cursor:grabbing
}

.card.dragging{
 opacity:.45;
 transform:scale(.98)
}

.card.drag-over{
 outline:3px dashed #3d7a5b;
 outline-offset:4px
}

.card h3{
 margin:0 0 12px 0
}

.text{
 display:block;
 width:100%;
 white-space:pre-wrap;
