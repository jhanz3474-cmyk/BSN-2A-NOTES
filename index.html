<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSN 2A NOTES</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f4ed;
    color: #333;
}

button {
    cursor: pointer;
    border: none;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 240px;
    height: 100vh;
    background: #eee8dc;
    padding: 25px 15px;
    border-right: 1px solid #ddd5c8;
}

.logo {
    font-family: Georgia, serif;
    font-size: 25px;
    font-weight: bold;
    margin: 0 10px 35px;
}

.logo span {
    color: #4d9b7a;
}

.nav button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 13px 15px;
    margin-bottom: 7px;
    border-radius: 12px;
    background: transparent;
    font-size: 16px;
    color: #444;
}

.nav button:hover,
.nav button.active {
    background: #ded6c8;
    color: #378d6b;
}

.admin-status {
    position: absolute;
    bottom: 25px;
    left: 20px;
    right: 20px;
}

.admin-btn {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    background: #ddd5c8;
    color: #444;
}

.admin-btn.admin-on {
    background: #4d9b7a;
    color: white;
}

.main {
    margin-left: 240px;
    min-height: 100vh;
}

.topbar {
    height: 65px;
    border-bottom: 1px solid #ddd5c8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 35px;
    background: #faf8f3;
}

.user-info {
    color: #777;
}

.page {
    padding: 40px;
    max-width: 1200px;
    margin: auto;
}

h1 {
    font-family: Georgia, serif;
    font-size: 40px;
    margin: 0 0 30px;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
}

.note-card {
    background: #f1ebdf;
    border: 1px solid #ddd4c5;
    border-radius: 15px;
    padding: 22px;
    min-height: 160px;
    cursor: grab;
    transition: 0.2s;
}

.note-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 18px rgba(0,0,0,.07);
}

.note-card:active {
    cursor: grabbing;
}

.note-title {
    font-family: Georgia, serif;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 12px;
}

.note-content {
    white-space: pre-wrap;
    line-height: 1.6;
    color: #666;
}

.card-buttons {
    display: flex;
    gap: 7px;
    margin-top: 18px;
}

.small-btn {
    padding: 7px 10px;
    border-radius: 7px;
    background: #ddd5c8;
}

.small-btn:hover {
    background: #ccc2b2;
}

.add-btn {
    background: #4d9b7a;
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    margin-bottom: 25px;
    font-size: 15px;
}

.add-btn:hover {
    background: #3d8465;
}

.empty {
    padding: 50px;
    text-align: center;
    color: #888;
    background: #f1ebdf;
    border-radius: 15px;
}

/* TASKS */

.task-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.task {
    background: #f1ebdf;
    padding: 17px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.task.done .task-text {
    text-decoration: line-through;
    opacity: .5;
}

.task-text {
    flex: 1;
}

/* CHAT */

.chat-box {
    background: #f1ebdf;
    border-radius: 15px;
    padding: 20px;
    max-width: 800px;
}

.messages {
    height: 430px;
    overflow-y: auto;
    margin-bottom: 15px;
}

.message {
    padding: 10px 13px;
    margin-bottom: 9px;
    background: #e4dccf;
    border-radius: 10px;
}

.message strong {
    color: #378d6b;
}

.message-time {
    font-size: 11px;
    color: #999;
    margin-left: 7px;
}

.chat-input {
    display: flex;
    gap: 8px;
}

.chat-input input {
    flex: 1;
}

/* MODAL */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
}

.overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 650px;
    background: #faf8f3;
    border-radius: 15px;
    padding: 28px;
    box-shadow: 0 15px 50px rgba(0,0,0,.2);
}

.modal h2 {
    font-family: Georgia, serif;
    margin-top: 0;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5ccbd;
    border-radius: 9px;
    background: white;
    font-family: inherit;
    font-size: 15px;
    margin-bottom: 13px;
}

textarea {
    min-height: 250px;
    resize: vertical;
    line-height: 1.6;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.save-btn {
    background: #4d9b7a;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
}

.cancel-btn {
    background: #ddd5c8;
    padding: 11px 18px;
    border-radius: 8px;
}

/* USERNAME */

.username-box {
    text-align: center;
}

.username-box h2 {
    font-family: Georgia, serif;
    font-size: 30px;
}

.username-box p {
    color: #777;
}

/* MOBILE */

@media(max-width: 700px) {
    .sidebar {
        width: 75px;
        padding: 20px 8px;
    }

    .logo {
        font-size: 0;
        text-align: center;
    }

    .logo span {
        font-size: 28px;
    }

    .nav button {
        font-size: 0;
        text-align: center;
    }

    .nav button::first-letter {
        font-size: 22px;
    }

    .admin-status {
        left: 8px;
        right: 8px;
    }

    .admin-btn {
        font-size: 0;
    }

    .admin-btn::first-letter {
        font-size: 20px;
    }

    .main {
        margin-left: 75px;
    }

    .page {
        padding: 25px 18px;
    }

    h1 {
        font-size: 32px;
    }

    .topbar {
        padding: 0 18px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        <span>🌱</span> BSN 2A NOTES
    </div>

    <div class="nav">
        <button class="active" onclick="showSection('notes', this)">
            📝 Notes
        </button>

        <button onclick="showSection('tasks', this)">
            ☑️ Tasks
        </button>

        <button onclick="showSection('chat', this)">
            💬 Chat
        </button>
    </div>

    <div class="admin-status">
        <button id="adminButton" class="admin-btn" onclick="toggleAdmin()">
            🔒 Admin
        </button>
    </div>

</aside>


<!-- MAIN -->

<main class="main">

    <header class="topbar">
        <div>📚 BSN 2A</div>
        <div class="user-info">
            👤 <span id="usernameDisplay"></span>
        </div>
    </header>


    <!-- NOTES -->

    <section id="notesSection" class="section active">

        <div class="page">

            <h1>Notes</h1>

            <button id="addNoteButton"
                    class="add-btn"
                    onclick="openNoteEditor()"
                    style="display:none;">
                + Add Note
            </button>

            <div id="notesGrid" class="notes-grid"></div>

        </div>

    </section>


    <!-- TASKS -->

    <section id="tasksSection" class="section">

        <div class="page">

            <h1>Tasks</h1>

            <button id="addTaskButton"
                    class="add-btn"
                    onclick="openTaskEditor()"
                    style="display:none;">
                + Add Task
            </button>

            <div id="taskList" class="task-list"></div>

        </div>

    </section>


    <!-- CHAT -->

    <section id="chatSection" class="section">

        <div class="page">

            <h1>Chat</h1>

            <div class="chat-box">

                <div id="messages" class="messages"></div>

                <div class="chat-input">

                    <input
                        id="chatInput"
                        type="text"
                        placeholder="Write a message..."
                        onkeydown="if(event.key==='Enter') sendMessage()"
                    >

                    <button class="save-btn" onclick="sendMessage()">
                        Send
                    </button>

                </div>

            </div>

        </div>

    </section>

</main>


<!-- USERNAME MODAL -->

<div id="usernameOverlay" class="overlay">

    <div class="modal username-box">

        <h2>Welcome to BSN 2A Notes 👋</h2>

        <p>Enter your name to continue.</p>

        <input
            id="usernameInput"
            type="text"
            placeholder="Your name"
            maxlength="30"
            onkeydown="if(event.key==='Enter') saveUsername()"
        >

        <button class="save-btn" onclick="saveUsername()">
            Enter
        </button>

    </div>

</div>


<!-- NOTE EDITOR -->

<div id="noteOverlay" class="overlay">

    <div class="modal">

        <h2 id="noteModalTitle">Add Note</h2>

        <input
            id="noteTitle"
            type="text"
            placeholder="Note title"
            maxlength="100"
        >

        <textarea
            id="noteContent"
            placeholder="Write your note here..."
        ></textarea>

        <div class="modal-buttons">

            <button class="cancel-btn"
                    onclick="closeNoteEditor()">
                Cancel
            </button>

            <button class="save-btn"
                    onclick="saveNote()">
                Save
            </button>

        </div>

    </div>

</div>


<!-- TASK EDITOR -->

<div id="taskOverlay" class="overlay">

    <div class="modal">

        <h2>Add Task</h2>

        <input
            id="taskInput"
            type="text"
            placeholder="Task..."
        >

        <div class="modal-buttons">

            <button class="cancel-btn"
                    onclick="closeTaskEditor()">
                Cancel
            </button>

            <button class="save-btn"
                    onclick="saveTask()">
                Save
            </button>

        </div>

    </div>

</div>


<!-- ADMIN PASSWORD -->

<div id="adminOverlay" class="overlay">

    <div class="modal username-box">

        <h2>🔒 Admin Mode</h2>

        <p>Enter the admin password.</p>

        <input
            id="adminPassword"
            type="password"
            placeholder="Password"
            onkeydown="if(event.key==='Enter') checkAdmin()"
        >

        <div class="modal-buttons">

            <button class="cancel-btn"
                    onclick="closeAdmin()">
                Cancel
            </button>

            <button class="save-btn"
                    onclick="checkAdmin()">
                Unlock
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   FIREBASE CONFIG
   ========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyA3IzXz0upKaOBSszJiMRBaKYGB4ajt24",

    authDomain: "bsn-2a-notes.firebaseapp.com",

    databaseURL:
    "https://bsn-2a-notes-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "bsn-2a-notes",

    storageBucket:
    "bsn-2a-notes.firebasestorage.app",

    messagingSenderId: "991210260962",

    appId:
    "1:991210260962:web:8f6a886c7478be096991bb",

    measurementId: "G-WNTP9GZJ4B"
};


/* Initialize Firebase */

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =========================================================
   USER
   ========================================================= */

let username = localStorage.getItem("bsnUsername");

let isAdmin = false;

let editingNoteId = null;


window.onload = function() {

    if (!username) {

        document
            .getElementById("usernameOverlay")
            .classList.add("show");

    } else {

        document
            .getElementById("usernameDisplay")
            .textContent = username;

    }

};


/* Save username */

function saveUsername() {

    const input =
        document.getElementById("usernameInput");

    const name = input.value.trim();

    if (!name) {

        alert("Please enter your name.");

        return;
    }

    username = name;

    localStorage.setItem("bsnUsername", username);

    document
        .getElementById("usernameDisplay")
        .textContent = username;

    document
        .getElementById("usernameOverlay")
        .classList.remove("show");

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function showSection(section, button) {

    document
        .querySelectorAll(".section")
        .forEach(s => s.classList.remove("active"));

    document
        .querySelectorAll(".nav button")
        .forEach(b => b.classList.remove("active"));

    document
        .getElementById(section + "Section")
        .classList.add("active");

    button.classList.add("active");
}


/* =========================================================
   ADMIN
   ========================================================= */

function toggleAdmin() {

    if (isAdmin) {

        isAdmin = false;

        updateAdminUI();

        alert("Admin mode locked.");

        return;
    }

    document
        .getElementById("adminOverlay")
        .classList.add("show");

    document
        .getElementById("adminPassword")
        .focus();
}


function checkAdmin() {

    const password =
        document
        .getElementById("adminPassword")
        .value;

    if (password === "supperlol123123") {

        isAdmin = true;

        document
            .getElementById("adminOverlay")
            .classList.remove("show");

        document
            .getElementById("adminPassword")
            .value = "";

        updateAdminUI();

        alert("Admin mode unlocked 🔓");

    } else {

        alert("Wrong password.");

    }

}


function closeAdmin() {

    document
        .getElementById("adminOverlay")
        .classList.remove("show");

    document
        .getElementById("adminPassword")
        .value = "";

}


function updateAdminUI() {

    const button =
        document.getElementById("adminButton");

    const addNote =
        document.getElementById("addNoteButton");

    const addTask =
        document.getElementById("addTaskButton");

    if (isAdmin) {

        button.textContent = "🔓 Admin ON";

        button.classList.add("admin-on");

        addNote.style.display = "inline-block";

        addTask.style.display = "inline-block";

    } else {

        button.textContent = "🔒 Admin";

        button.classList.remove("admin-on");

        addNote.style.display = "none";

        addTask.style.display = "none";

    }

}


/* =========================================================
   NOTES - REALTIME DATABASE
   ========================================================= */

db.ref("notes").on("value", snapshot => {

    const data = snapshot.val() || {};

    renderNotes(data);

});


function renderNotes(data) {

    const grid =
        document.getElementById("notesGrid");

    grid.innerHTML = "";

    const notes = Object.entries(data);

    notes.sort((a,b) => {

        const orderA =
            a[1].order ?? a[1].createdAt ?? 0;

        const orderB =
            b[1].order ?? b[1].createdAt ?? 0;

        return orderA - orderB;

    });


    if (notes.length === 0) {

        grid.innerHTML =
            `<div class="empty">
                No notes yet.
                ${isAdmin ? "Click + Add Note to create one." : ""}
            </div>`;

        return;
    }


    notes.forEach(([id, note]) => {

        const card =
            document.createElement("div");

        card.className = "note-card";

        card.draggable = isAdmin;

        card.dataset.id = id;

        card.onclick = function(e) {

            if (
                e.target.tagName === "BUTTON"
            ) return;

            openNote(id, note);

        };


        card.ondragstart = function(e) {

            e.dataTransfer.setData(
                "text/plain",
                id
            );

        };


        card.ondragover = function(e) {

            e.preventDefault();

        };


        card.ondrop = function(e) {

            e.preventDefault();

            if (!isAdmin) return;

            const draggedId =
                e.dataTransfer.getData("text/plain");

            reorderNotes(
                draggedId,
                id
            );

        };


        let html = `

            <div class="note-title">
                ${escapeHTML(note.title)}
            </div>

            <div class="note-content">
                ${escapeHTML(note.content)}
            </div>

        `;


        if (isAdmin) {

            html += `

                <div class="card-buttons">

                    <button
                        class="small-btn"
                        onclick="event.stopPropagation();
                        editNote('${id}')">
                        ✏️ Edit
                    </button>

                    <button
                        class="small-btn"
                        onclick="event.stopPropagation();
                        deleteNote('${id}')">
                        🗑️ Delete
                    </button>

                </div>

            `;

        }


        card.innerHTML = html;

        grid.appendChild(card);

    });

}


function openNoteEditor(id = null) {

    if (!isAdmin) return;

    editingNoteId = id;

    const title =
        document.getElementById("noteTitle");

    const content =
        document.getElementById("noteContent");

    if (id) {

        db.ref("notes/" + id)
            .once("value")
            .then(snapshot => {

                const note = snapshot.val();

                title.value = note.title || "";

                content.value = note.content || "";

                document
                    .getElementById("noteModalTitle")
                    .textContent = "Edit Note";

                document
                    .getElementById("noteOverlay")
                    .classList.add("show");

            });

    } else {

        title.value = "";

        content.value = "";

        document
            .getElementById("noteModalTitle")
            .textContent = "Add Note";

        document
            .getElementById("noteOverlay")
            .classList.add("show");

    }

}


function editNote(id) {

    openNoteEditor(id);

}


function openNote(id, note) {

    document
        .getElementById("noteTitle")
        .value = note.title;

    document
        .getElementById("noteContent")
        .value = note.content;

    editingNoteId = id;

    document
        .getElementById("noteModalTitle")
        .textContent = isAdmin
            ? "Edit Note"
            : note.title;

    document
        .getElementById("noteOverlay")
        .classList.add("show");

    /* View-only users should not accidentally edit */

    if (!isAdmin) {

        document
            .getElementById("noteTitle")
            .disabled = true;

        document
            .getElementById("noteContent")
            .disabled = true;

    } else {

        document
            .getElementById("noteTitle")
            .disabled = false;

        document
            .getElementById("noteContent")
            .disabled = false;

    }

}


function saveNote() {

    if (!isAdmin) return;

    const title =
        document
        .getElementById("noteTitle")
        .value.trim();

    const content =
        document
        .getElementById("noteContent")
        .value.trim();

    if (!title) {

        alert("Please enter a title.");

        return;

    }


    if (!content) {

        alert("Please enter some text.");

        return;

    }


    if (editingNoteId) {

        db.ref("notes/" + editingNoteId)
            .update({

                title: title,

                content: content,

                updatedAt: Date.now(),

                updatedBy: username

            });

    } else {

        const newRef =
            db.ref("notes").push();

        newRef.set({

            title: title,

            content: content,

            createdAt: Date.now(),

            updatedAt: Date.now(),

            updatedBy: username,

            order: Date.now()

        });

    }


    closeNoteEditor();

}


function closeNoteEditor() {

    document
        .getElementById("noteOverlay")
        .classList.remove("show");

    document
        .getElementById("noteTitle")
        .disabled = false;

    document
        .getElementById("noteContent")
        .disabled = false;

    editingNoteId = null;

}


function deleteNote(id) {

    if (!isAdmin) return;

    if (
        confirm("Delete this note permanently?")
    ) {

        db.ref("notes/" + id).remove();

    }

}


/* =========================================================
   DRAG / DROP REORDER
   ========================================================= */

function reorderNotes(draggedId, targetId) {

    if (
        !draggedId ||
        !targetId ||
        draggedId === targetId
    ) return;


    db.ref("notes").once("value")
        .then(snapshot => {

            const notes =
                snapshot.val() || {};

            const entries =
                Object.entries(notes);

            entries.sort((a,b) =>
                (a[1].order || 0) -
                (b[1].order || 0)
            );


            const draggedIndex =
                entries.findIndex(
                    x => x[0] === draggedId
                );

            const targetIndex =
                entries.findIndex(
                    x => x[0] === targetId
                );


            const dragged =
                entries.splice(
                    draggedIndex,
                    1
                )[0];

            entries.splice(
                targetIndex,
                0,
                dragged
            );


            const updates = {};

            entries.forEach(
                ([id], index) => {

                    updates[
                        "notes/" +
                        id +
                        "/order"
                    ] = index;

                }
            );


            db.ref().update(updates);

        });

}


/* =========================================================
   TASKS
   ========================================================= */

db.ref("tasks").on("value", snapshot => {

    const tasks =
        snapshot.val() || {};

    renderTasks(tasks);

});


function renderTasks(tasks) {

    const list =
        document.getElementById("taskList");

    list.innerHTML = "";

    const entries =
        Object.entries(tasks);


    if (entries.length === 0) {

        list.innerHTML =
            `<div class="empty">
                No tasks yet.
            </div>`;

        return;

    }


    entries.sort(
        (a,b) =>
        (a[1].createdAt || 0) -
        (b[1].createdAt || 0)
    );


    entries.forEach(([id, task]) => {

        const div =
            document.createElement("div");

        div.className =
            "task " +
            (task.done ? "done" : "");


        div.innerHTML = `

            <input
                type="checkbox"
                ${task.done ? "checked" : ""}
                onchange="toggleTask('${id}')"
            >

            <div class="task-text">
                ${escapeHTML(task.text)}
            </div>

            ${
                isAdmin
                ?
                `<button
                    class="small-btn"
                    onclick="deleteTask('${id}')">
                    🗑️
                </button>`
                :
                ""
            }

        `;

        list.appendChild(div);

    });

}


function openTaskEditor() {

    if (!isAdmin) return;

    document
        .getElementById("taskInput")
        .value = "";

    document
        .getElementById("taskOverlay")
        .classList.add("show");

    document
        .getElementById("taskInput")
        .focus();

}


function closeTaskEditor() {

    document
        .getElementById("taskOverlay")
        .classList.remove("show");

}


function saveTask() {

    if (!isAdmin) return;

    const text =
        document
        .getElementById("taskInput")
        .value.trim();

    if (!text) return;


    db.ref("tasks").push({

        text: text,

        done: false,

        createdAt: Date.now(),

        createdBy: username

    });


    closeTaskEditor();

}


function toggleTask(id) {

    db.ref("tasks/" + id + "/done")
        .once("value")
        .then(snapshot => {

            db.ref("tasks/" + id + "/done")
                .set(!snapshot.val());

        });

}


function deleteTask(id) {

    if (!isAdmin) return;

    if (confirm("Delete this task?")) {

        db.ref("tasks/" + id).remove();

    }

}


/* =========================================================
   CHAT
   ========================================================= */

db.ref("chat").on("value", snapshot => {

    const messages =
        snapshot.val() || {};

    renderMessages(messages);

});


function renderMessages(messages) {

    const box =
        document.getElementById("messages");

    box.innerHTML = "";

    const entries =
        Object.entries(messages);


    entries.sort(
        (a,b) =>
        (a[1].timestamp || 0) -
        (b[1].timestamp || 0)
    );


    entries.forEach(([id, msg]) => {

        const div =
            document.createElement("div");

        div.className = "message";

        const time =
            new Date(
                msg.timestamp || Date.now()
            ).toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );


        div.innerHTML = `

            <strong>
                ${escapeHTML(msg.user)}
            </strong>

            <span class="message-time">
                ${time}
            </span>

            <div>
                ${escapeHTML(msg.text)}
            </div>

        `;


        box.appendChild(div);

    });


    box.scrollTop =
        box.scrollHeight;

}


function sendMessage() {

    const input =
        document.getElementById("chatInput");

    const text =
        input.value.trim();

    if (!text) return;


    db.ref("chat").push({

        user: username,

        text: text,

        timestamp: Date.now()

    });


    input.value = "";

}


/* =========================================================
   SECURITY / HTML ESCAPE
   ========================================================= */

function escapeHTML(text) {

    if (!text) return "";

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
