<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BSN 2A NOTES</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f8f6f1;
    color: #302b25;
    font-family: Arial, sans-serif;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 240px;
    height: 100vh;
    background: #f1ece2;
    border-right: 1px solid #ddd5c8;
    padding: 25px 15px;
    z-index: 10;
}

.logo {
    font-family: Georgia, serif;
    font-size: 21px;
    font-weight: bold;
    padding: 5px 10px 35px;
}

.menu {
    padding: 13px 14px;
    margin: 5px 0;
    border-radius: 12px;
    cursor: pointer;
    color: #4b443c;
}

.menu:hover {
    background: #e6ded2;
}

.menu.active {
    background: #e1d8ca;
    color: #328b6d;
}

/* TOP BAR */

.topbar {
    position: fixed;
    left: 240px;
    right: 0;
    top: 0;
    height: 65px;
    background: #f8f6f1;
    border-bottom: 1px solid #ddd5c8;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 25px;
    z-index: 5;
}

.lock-button {
    border: none;
    background: transparent;
    padding: 10px 14px;
    border-radius: 9px;
    color: #756b61;
    cursor: pointer;
    font-size: 14px;
}

.lock-button:hover {
    background: #eee8dd;
}

/* MAIN */

.main {
    margin-left: 240px;
    padding: 105px 45px 50px;
    max-width: 1250px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

h1 {
    font-family: Georgia, serif;
    font-size: 36px;
    margin: 0 0 30px;
}

/* NOTES */

.notes {
    display: grid;
    grid-template-columns: repeat(2, minmax(280px, 1fr));
    gap: 20px;
}

.note {
    background: #f4eee4;
    border: 1px solid #ddd4c6;
    border-radius: 14px;
    padding: 25px;
    min-height: 150px;
    cursor: pointer;

    box-shadow: 0 2px 5px rgba(0,0,0,.04);

    transition: .2s;
}

.note:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.note.dragging {
    opacity: .45;
}

.note h2 {
    font-family: Georgia, serif;
    margin: 0 0 12px;
    font-size: 21px;
}

.note p {
    margin: 0;
    color: #756c63;
    line-height: 1.65;
    white-space: pre-wrap;
    font-size: 14px;
}

.add-button {
    display: none;

    margin-top: 25px;

    border: 1px dashed #8b9d8f;
    border-radius: 12px;

    background: transparent;

    padding: 14px 20px;

    color: #328b6d;

    cursor: pointer;

    font-size: 15px;
}

.admin .add-button {
    display: inline-block;
}

.add-button:hover {
    background: #ebe5da;
}

/* NOTE EDITOR */

.note-modal {
    position: fixed;
    inset: 0;

    background: rgba(40,35,30,.55);

    display: none;

    justify-content: center;
    align-items: center;

    padding: 30px;

    z-index: 100;
}

.note-modal.show {
    display: flex;
}

.note-window {
    width: min(850px, 100%);
    height: min(750px, 90vh);

    background: #fffdf9;

    border-radius: 14px;

    box-shadow: 0 20px 70px rgba(0,0,0,.3);

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

/* NOTE HEADER */

.note-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 15px 20px;

    border-bottom: 1px solid #eee6db;
}

.note-header button {
    border: none;

    background: transparent;

    cursor: pointer;

    font-size: 20px;

    padding: 8px;

    border-radius: 8px;
}

.note-header button:hover {
    background: #eee8dc;
}

.note-title {
    flex: 1;

    border: none;

    outline: none;

    background: transparent;

    font-family: Georgia, serif;

    font-size: 25px;

    margin: 0 15px;

    color: #302b25;
}

.note-title:disabled {
    color: #302b25;
}

/* NOTE BODY */

.note-body {
    flex: 1;

    padding: 25px;

    overflow-y: auto;
}

.note-content {
    width: 100%;

    min-height: 100%;

    border: none;

    outline: none;

    resize: none;

    background: transparent;

    font-family: Arial, sans-serif;

    font-size: 16px;

    line-height: 1.7;

    color: #302b25;
}

/* FOOTER */

.note-footer {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 12px 20px;

    border-top: 1px solid #eee6db;
}

.note-footer button {
    border: none;

    background: transparent;

    padding: 9px 13px;

    border-radius: 8px;

    cursor: pointer;
}

.note-footer button:hover {
    background: #eee8dc;
}

.save-button {
    background: #3f9072 !important;

    color: white;
}

.delete-button {
    color: #a34840;
}

/* TASKS */

.task-list {
    max-width: 800px;
}

.task {
    background: #f4eee4;
    border: 1px solid #ddd4c6;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;

    display: flex;
    align-items: center;
    gap: 12px;
}

.task-text {
    flex: 1;
}

.task.done .task-text {
    text-decoration: line-through;
    opacity: .5;
}

.task-delete {
    display: none;
}

.admin .task-delete {
    display: block;
}

.task-delete button {
    border: none;
    background: transparent;
    cursor: pointer;
}

/* CHAT */

.chat-box {
    max-width: 800px;

    background: #f4eee4;

    border: 1px solid #ddd4c6;

    border-radius: 14px;

    padding: 20px;
}

.messages {
    height: 400px;
    overflow-y: auto;
}

.message {
    background: #e8dfd2;

    padding: 10px 14px;

    border-radius: 12px;

    margin-bottom: 10px;

    max-width: 80%;
}

.chat-input {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.chat-input input {
    flex: 1;

    border: 1px solid #ccc2b4;

    border-radius: 9px;

    padding: 12px;
}

.chat-input button {
    border: none;

    background: #3f9072;

    color: white;

    border-radius: 9px;

    padding: 10px 18px;

    cursor: pointer;
}

/* EMPTY */

.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 60px 20px;

    color: #81776c;
}

/* MOBILE */

@media(max-width:750px) {

    .sidebar {
        width: 180px;
    }

    .topbar {
        left: 180px;
    }

    .main {
        margin-left: 180px;
        padding-left: 25px;
        padding-right: 25px;
    }

    .notes {
        grid-template-columns: 1fr;
    }
}

@media(max-width:520px) {

    .sidebar {
        width: 65px;
        padding: 20px 7px;
    }

    .logo {
        font-size: 0;
        text-align: center;
    }

    .logo:first-letter {
        font-size: 24px;
    }

    .menu {
        text-align: center;
        font-size: 0;
    }

    .menu:first-letter {
        font-size: 20px;
    }

    .topbar {
        left: 65px;
    }

    .main {
        margin-left: 65px;
        padding: 95px 15px 30px;
    }

    h1 {
        font-size: 30px;
    }

    .note-modal {
        padding: 0;
    }

    .note-window {
        height: 100vh;
        border-radius: 0;
    }
}

</style>
</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        🌱 BSN 2A NOTES
    </div>

    <div
        class="menu active"
        onclick="showPage('notes', this)"
    >
        📝 Notes
    </div>

    <div
        class="menu"
        onclick="showPage('tasks', this)"
    >
        ☑ Tasks
    </div>

    <div
        class="menu"
        onclick="showPage('chat', this)"
    >
        💬 Chat
    </div>

</div>


<!-- TOP BAR -->

<div class="topbar">

    <button
        class="lock-button"
        id="lockButton"
        onclick="toggleAdmin()"
    >
        🔒 View Only
    </button>

</div>


<!-- MAIN -->

<div class="main">


<!-- NOTES -->

<div
    id="notes"
    class="page active"
>

    <h1>Notes</h1>

    <div
        class="notes"
        id="notesContainer"
    ></div>

    <button
        class="add-button"
        onclick="openNewNote()"
    >
        ＋ Add Note
    </button>

</div>


<!-- TASKS -->

<div
    id="tasks"
    class="page"
>

    <h1>Tasks</h1>

    <div
        class="task-list"
        id="taskContainer"
    ></div>

    <button
        class="add-button"
        onclick="addTask()"
    >
        ＋ Add Task
    </button>

</div>


<!-- CHAT -->

<div
    id="chat"
    class="page"
>

    <h1>Chat</h1>

    <div class="chat-box">

        <div
            class="messages"
            id="messages"
        ></div>

        <div class="chat-input">

            <input
                id="chatInput"
                placeholder="Write a message..."
                onkeydown="
                    if(event.key === 'Enter')
                    sendMessage()
                "
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

</div>

</div>


<!-- =========================
     NOTE WINDOW
========================= -->

<div
    class="note-modal"
    id="noteModal"
>

    <div class="note-window">


        <!-- HEADER -->

        <div class="note-header">

            <button onclick="closeNote()">
                ✕
            </button>

            <input
                class="note-title"
                id="noteTitle"
                placeholder="Title"
            >

            <button
                onclick="saveCurrentNote()"
                title="Save"
            >
                💾
            </button>

        </div>


        <!-- BODY -->

        <div class="note-body">

            <textarea
                class="note-content"
                id="noteContent"
                placeholder="Write your note..."
            ></textarea>

        </div>


        <!-- FOOTER -->

        <div class="note-footer">

            <button
                class="delete-button"
                id="deleteNoteButton"
                onclick="deleteCurrentNote()"
            >
                🗑 Delete
            </button>

            <span id="noteStatus"></span>

            <button
                class="save-button"
                id="saveNoteButton"
                onclick="saveCurrentNote()"
            >
                Save
            </button>

        </div>

    </div>

</div>


<!-- LOGIN -->

<div
    class="note-modal"
    id="loginModal"
>

    <div
        class="note-window"
        style="
            width:400px;
            height:auto;
        "
    >

        <div class="note-header">

            <span
                style="
                    font-family:Georgia,serif;
                    font-size:22px;
                "
            >
                🔒 Admin Access
            </span>

            <button onclick="closeLogin()">
                ✕
            </button>

        </div>

        <div
            style="padding:25px;"
        >

            <p>
                Enter the administrator password.
            </p>

            <input
                id="adminPassword"
                type="password"
                placeholder="Password"
                style="
                    width:100%;
                    padding:12px;
                    border:1px solid #ccc2b4;
                    border-radius:8px;
                "
                onkeydown="
                    if(event.key==='Enter')
                    login()
                "
            >

            <p
                id="loginError"
                style="color:#a34840;"
            ></p>

            <button
                class="save-button"
                onclick="login()"
                style="
                    border:none;
                    padding:11px 20px;
                    border-radius:8px;
                    cursor:pointer;
                "
            >
                Unlock
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   ADMIN
========================= */

const ADMIN_PASSWORD =
    "supperlol123123";

let isAdmin = false;


/* =========================
   DATA
========================= */

let notes =
    JSON.parse(
        localStorage.getItem("bsn_notes")
    ) || [

        {
            id: Date.now(),
            title: "Welcome",
            content:
                "Welcome to BSN 2A NOTES!"
        },

        {
            id: Date.now() + 1,
            title: "Class Notes",
            content:
                "Click this card to open the note."
        }

    ];


let tasks =
    JSON.parse(
        localStorage.getItem("bsn_tasks")
    ) || [];


let messages =
    JSON.parse(
        localStorage.getItem("bsn_messages")
    ) || [];


let currentNoteId = null;


/* =========================
   SAVE
========================= */

function saveData() {

    localStorage.setItem(
        "bsn_notes",
        JSON.stringify(notes)
    );

    localStorage.setItem(
        "bsn_tasks",
        JSON.stringify(tasks)
    );

    localStorage.setItem(
        "bsn_messages",
        JSON.stringify(messages)
    );

}


/* =========================
   RENDER NOTES
========================= */

function renderNotes() {

    const container =
        document.getElementById(
            "notesContainer"
        );

    container.innerHTML = "";


    if(notes.length === 0) {

        container.innerHTML =
            `<div class="empty">
                No notes yet.
            </div>`;

        return;
    }


    notes.forEach(note => {

        const card =
            document.createElement("div");

        card.className = "note";

        card.draggable = isAdmin;

        card.dataset.id = note.id;


        card.innerHTML = `

            <h2>
                📌 ${escapeHTML(note.title)}
            </h2>

            <p>
                ${escapeHTML(
                    note.content
                )}
            </p>

        `;


        /* OPEN NOTE */

        card.onclick = function() {

            openNote(note.id);

        };


        /* DRAG */

        card.addEventListener(
            "dragstart",
            function(e) {

                if(!isAdmin) return;

                e.dataTransfer.setData(
                    "text/plain",
                    note.id
                );

                card.classList.add(
                    "dragging"
                );

            }
        );


        card.addEventListener(
            "dragover",
            function(e) {

                if(isAdmin)
                    e.preventDefault();

            }
        );


        card.addEventListener(
            "drop",
            function(e) {

                if(!isAdmin) return;

                e.preventDefault();

                const draggedId =
                    Number(
                        e.dataTransfer.getData(
                            "text/plain"
                        )
                    );

                const from =
                    notes.findIndex(
                        n =>
                            n.id ===
                            draggedId
                    );

                const to =
                    notes.findIndex(
                        n =>
                            n.id ===
                            note.id
                    );

                if(from === to) return;

                const moved =
                    notes.splice(
                        from,
                        1
                    )[0];

                notes.splice(
                    to,
                    0,
                    moved
                );

                saveData();

                renderNotes();

            }
        );


        container.appendChild(card);

    });

}


/* =========================
   OPEN EXISTING NOTE
========================= */

function openNote(id) {

    const note =
        notes.find(
            n => n.id === id
        );

    if(!note) return;


    currentNoteId = id;


    document
        .getElementById("noteTitle")
        .value = note.title;


    document
        .getElementById("noteContent")
        .value = note.content;


    document
        .getElementById("noteModal")
        .classList.add("show");


    updateEditorMode();

}


/* =========================
   NEW NOTE
========================= */

function openNewNote() {

    if(!isAdmin) return;


    currentNoteId = null;


    document
        .getElementById("noteTitle")
        .value = "";


    document
        .getElementById("noteContent")
        .value = "";


    document
        .getElementById("noteModal")
        .classList.add("show");


    updateEditorMode();


    document
        .getElementById("noteTitle")
        .focus();

}


/* =========================
   EDITOR MODE
========================= */

function updateEditorMode() {

    const title =
        document.getElementById(
            "noteTitle"
        );

    const content =
        document.getElementById(
            "noteContent"
        );

    const save =
        document.getElementById(
            "saveNoteButton"
        );

    const deleteButton =
        document.getElementById(
            "deleteNoteButton"
        );


    title.disabled =
        !isAdmin;

    content.readOnly =
        !isAdmin;


    save.style.display =
        isAdmin
        ? "block"
        : "none";


    deleteButton.style.display =
        isAdmin
        ? "block"
        : "none";

}


/* =========================
   SAVE NOTE
========================= */

function saveCurrentNote() {

    if(!isAdmin) return;


    const title =
        document
            .getElementById(
                "noteTitle"
            )
            .value
            .trim();


    const content =
        document
            .getElementById(
                "noteContent"
            )
            .value
            .trim();


    if(!title) {

        alert(
            "Please enter a title."
        );

        return;

    }


    /* EDIT */

    if(currentNoteId !== null) {

        const note =
            notes.find(
                n =>
                    n.id ===
                    currentNoteId
            );


        note.title = title;

        note.content = content;

    }


    /* NEW */

    else {

        notes.push({

            id: Date.now(),

            title: title,

            content: content

        });

    }


    saveData();

    renderNotes();

    closeNote();

}


/* =========================
   DELETE NOTE
========================= */

function deleteCurrentNote() {

    if(!isAdmin) return;


    if(currentNoteId === null) {

        closeNote();

        return;

    }


    if(
        !confirm(
            "Delete this note permanently?"
        )
    ) return;


    notes =
        notes.filter(
            n =>
                n.id !==
                currentNoteId
        );


    saveData();

    renderNotes();

    closeNote();

}


/* =========================
   CLOSE NOTE
========================= */

function closeNote() {

    document
        .getElementById(
            "noteModal"
        )
        .classList.remove("show");

    currentNoteId = null;

}


/* =========================
   ADMIN LOGIN
========================= */

function toggleAdmin() {

    if(isAdmin) {

        isAdmin = false;

        document.body
            .classList.remove(
                "admin"
            );

        document
            .getElementById(
                "lockButton"
            )
            .textContent =
            "🔒 View Only";


        renderNotes();

        updateEditorMode();

    }

    else {

        document
            .getElementById(
                "loginModal"
            )
            .classList.add("show");

    }

}


function login() {

    const password =
        document
            .getElementById(
                "adminPassword"
            )
            .value;


    if(
        password ===
        ADMIN_PASSWORD
    ) {

        isAdmin = true;


        document.body
            .classList.add(
                "admin"
            );


        document
            .getElementById(
                "lockButton"
            )
            .textContent =
            "🔓 Admin";


        document
            .getElementById(
                "loginModal"
            )
            .classList.remove(
                "show"
            );


        document
            .getElementById(
                "adminPassword"
            )
            .value = "";


        document
            .getElementById(
                "loginError"
            )
            .textContent = "";


        renderNotes();

        updateEditorMode();

    }

    else {

        document
            .getElementById(
                "loginError"
            )
            .textContent =
            "Incorrect password.";

    }

}


function closeLogin() {

    document
        .getElementById(
            "loginModal"
        )
        .classList.remove(
            "show"
        );

}


/* =========================
   TASKS
========================= */

function renderTasks() {

    const container =
        document.getElementById(
            "taskContainer"
        );

    container.innerHTML = "";


    if(tasks.length === 0) {

        container.innerHTML =
            `<div class="empty">
                No tasks yet.
            </div>`;

        return;

    }


    tasks.forEach(task => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "task";


        if(task.done)
            div.classList.add(
                "done"
            );


        div.innerHTML = `

            <input
                type="checkbox"
                ${task.done ? "checked" : ""}
                onchange="
                    toggleTask(${task.id})
                "
            >

            <span class="task-text">
                ${escapeHTML(task.text)}
            </span>

            <div class="task-delete">

                <button
                    onclick="
                        deleteTask(${task.id})
                    "
                >
                    🗑
                </button>

            </div>

        `;


        container.appendChild(div);

    });

}


function addTask() {

    if(!isAdmin) return;


    const text =
        prompt(
            "Enter task:"
        );


    if(!text) return;


    tasks.push({

        id: Date.now(),

        text: text,

        done: false

    });


    saveData();

    renderTasks();

}


function toggleTask(id) {

    if(!isAdmin) return;


    const task =
        tasks.find(
            t => t.id === id
        );


    task.done =
        !task.done;


    saveData();

    renderTasks();

}


function deleteTask(id) {

    if(!isAdmin) return;


    tasks =
        tasks.filter(
            t => t.id !== id
        );


    saveData();

    renderTasks();

}


/* =========================
   CHAT
========================= */

function renderMessages() {

    const box =
        document.getElementById(
            "messages"
        );

    box.innerHTML = "";


    messages.forEach(message => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "message";

        div.textContent =
            message;

        box.appendChild(div);

    });


    box.scrollTop =
        box.scrollHeight;

}


function sendMessage() {

    const input =
        document.getElementById(
            "chatInput"
        );


    const text =
        input.value.trim();


    if(!text) return;


    messages.push(text);

    saveData();

    renderMessages();

    input.value = "";

}


/* =========================
   NAVIGATION
========================= */

function showPage(page, button) {

    document
        .querySelectorAll(".page")
        .forEach(
            p =>
                p.classList.remove(
                    "active"
                )
        );


    document
        .getElementById(page)
        .classList.add("active");


    document
        .querySelectorAll(".menu")
        .forEach(
            m =>
                m.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================
   CLOSE MODALS
========================= */

document
    .getElementById(
        "noteModal"
    )
    .addEventListener(
        "click",
        function(e) {

            if(
                e.target ===
                this
            )
                closeNote();

        }
    );


document
    .getElementById(
        "loginModal"
    )
    .addEventListener(
