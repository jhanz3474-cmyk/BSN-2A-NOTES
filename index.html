<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BSN 2A NOTES</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f8f6f1;
    color: #302b25;
    font-family: Georgia, serif;
}

button,
input,
textarea {
    font-family: inherit;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;

    width: 240px;
    height: 100vh;

    background: #f1ece2;

    border-right: 1px solid #ddd5c8;

    padding: 25px 15px;

    z-index: 10;
}

.logo {
    font-size: 21px;
    font-weight: bold;

    padding: 5px 10px 35px;

    color: #302b25;
}

.menu {
    padding: 13px 14px;

    margin: 5px 0;

    border-radius: 12px;

    cursor: pointer;

    color: #4b443c;

    transition: .2s;
}

.menu:hover {
    background: #e6ded2;
}

.menu.active {
    background: #e1d8ca;

    color: #328b6d;
}


/* =========================
   TOP BAR
========================= */

.topbar {
    position: fixed;

    left: 240px;
    right: 0;
    top: 0;

    height: 65px;

    background: #f8f6f1;

    border-bottom: 1px solid #ddd5c8;

    display: flex;

    justify-content: flex-end;

    align-items: center;

    padding: 0 25px;

    z-index: 5;
}

.lock-button {
    border: none;

    background: transparent;

    padding: 10px 14px;

    border-radius: 9px;

    color: #756b61;

    cursor: pointer;

    font-size: 14px;
}

.lock-button:hover {
    background: #eee8dd;
}


/* =========================
   MAIN
========================= */

.main {
    margin-left: 240px;

    padding: 105px 45px 50px;

    max-width: 1250px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

h1 {
    font-size: 36px;

    margin: 0 0 30px;
}


/* =========================
   NOTES
========================= */

.notes {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(280px, 1fr));

    gap: 20px;
}

.note {
    background: #f4eee4;

    border: 1px solid #ddd4c6;

    border-radius: 14px;

    padding: 23px;

    min-height: 150px;

    box-shadow:
        0 2px 5px rgba(0,0,0,.04);

    cursor: grab;

    transition: .2s;

    position: relative;
}

.note:active {
    cursor: grabbing;
}

.note.dragging {
    opacity: .45;

    transform: scale(.98);
}

.note h2 {
    margin: 0 0 12px;

    font-size: 21px;
}

.note p {
    margin: 0;

    color: #756c63;

    line-height: 1.65;

    white-space: pre-wrap;

    font-family: Arial, sans-serif;

    font-size: 14px;
}

.note-buttons {
    display: none;

    gap: 7px;

    margin-top: 18px;
}

.admin .note-buttons {
    display: flex;
}

.note-buttons button {
    border: 1px solid #cec4b6;

    background: #eee8dc;

    border-radius: 7px;

    padding: 7px 11px;

    cursor: pointer;

    font-size: 13px;
}

.note-buttons .delete {
    color: #a34840;
}


/* =========================
   ADD BUTTON
========================= */

.add-button {
    display: none;

    margin-top: 25px;

    border: 1px dashed #8b9d8f;

    border-radius: 12px;

    background: transparent;

    padding: 14px 20px;

    color: #328b6d;

    cursor: pointer;

    font-size: 15px;
}

.admin .add-button {
    display: inline-block;
}

.add-button:hover {
    background: #ebe5da;
}


/* =========================
   TASKS
========================= */

.task-list {
    max-width: 800px;
}

.task {
    background: #f4eee4;

    border: 1px solid #ddd4c6;

    border-radius: 12px;

    padding: 16px;

    margin-bottom: 12px;

    display: flex;

    align-items: center;

    gap: 12px;
}

.task input[type="checkbox"] {
    width: 18px;
    height: 18px;
}

.task-text {
    flex: 1;

    font-family: Arial, sans-serif;
}

.task.done .task-text {
    text-decoration: line-through;

    opacity: .5;
}

.task-actions {
    display: none;

    gap: 5px;
}

.admin .task-actions {
    display: flex;
}

.task-actions button {
    border: none;

    background: transparent;

    cursor: pointer;
}


/* =========================
   CHAT
========================= */

.chat-box {
    max-width: 800px;

    background: #f4eee4;

    border: 1px solid #ddd4c6;

    border-radius: 14px;

    padding: 20px;
}

.messages {
    height: 400px;

    overflow-y: auto;

    padding: 10px;
}

.message {
    background: #e8dfd2;

    padding: 10px 14px;

    border-radius: 12px;

    margin-bottom: 10px;

    max-width: 80%;

    font-family: Arial, sans-serif;
}

.chat-input {
    display: flex;

    gap: 8px;

    margin-top: 15px;
}

.chat-input input {
    flex: 1;

    border: 1px solid #ccc2b4;

    border-radius: 9px;

    padding: 12px;

    background: #fffdf9;
}

.chat-input button {
    border: none;

    background: #3f9072;

    color: white;

    border-radius: 9px;

    padding: 10px 18px;

    cursor: pointer;
}


/* =========================
   EMPTY
========================= */

.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 60px 20px;

    color: #81776c;
}


/* =========================
   MODAL
========================= */

.modal-bg {
    position: fixed;

    inset: 0;

    background: rgba(30,25,20,.5);

    display: none;

    justify-content: center;

    align-items: center;

    padding: 20px;

    z-index: 100;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: 100%;

    max-width: 500px;

    background: #f8f5ee;

    border-radius: 15px;

    padding: 28px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);
}

.modal h2 {
    margin-top: 0;
}

.modal label {
    display: block;

    margin:
        15px 0 6px;

    font-size: 14px;
}

.modal input,
.modal textarea {
    width: 100%;

    border: 1px solid #ccc2b4;

    border-radius: 8px;

    padding: 12px;

    background: #fffdf9;

    font-family: Arial, sans-serif;

    font-size: 14px;
}

.modal textarea {
    min-height: 180px;

    resize: vertical;
}

.modal-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 20px;
}

.modal-buttons button {
    border: 1px solid #cec4b6;

    background: #eee8dc;

    padding: 9px 15px;

    border-radius: 8px;

    cursor: pointer;
}

.modal-buttons .primary {
    background: #3f9072;

    border-color: #3f9072;

    color: white;
}


/* =========================
   MOBILE
========================= */

@media(max-width:750px) {

    .sidebar {
        width: 180px;
    }

    .topbar {
        left: 180px;
    }

    .main {
        margin-left: 180px;

        padding-left: 25px;
        padding-right: 25px;
    }

    .notes {
        grid-template-columns: 1fr;
    }
}

@media(max-width:520px) {

    .sidebar {
        width: 65px;

        padding: 20px 7px;
    }

    .logo {
        font-size: 0;

        text-align: center;
    }

    .logo:first-letter {
        font-size: 24px;
    }

    .menu {
        text-align: center;

        font-size: 0;
    }

    .menu:first-letter {
        font-size: 20px;
    }

    .topbar {
        left: 65px;
    }

    .main {
        margin-left: 65px;

        padding: 95px 15px 30px;
    }

    h1 {
        font-size: 30px;
    }
}

</style>

</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

    <div class="logo">
        🌱 BSN 2A NOTES
    </div>

    <div
        class="menu active"
        onclick="showPage('notes', this)"
    >
        📝 Notes
    </div>

    <div
        class="menu"
        onclick="showPage('tasks', this)"
    >
        ☑ Tasks
    </div>

    <div
        class="menu"
        onclick="showPage('chat', this)"
    >
        💬 Chat
    </div>

</div>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">

    <button
        class="lock-button"
        onclick="toggleAdmin()"
        id="lockButton"
    >
        🔒 View Only
    </button>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="main">


<!-- =========================
     NOTES PAGE
========================= -->

<div
    id="notes"
    class="page active"
>

    <h1>Notes</h1>

    <div
        class="notes"
        id="notesContainer"
    ></div>

    <button
        class="add-button"
        onclick="openNoteModal()"
    >
        ＋ Add Note
    </button>

</div>


<!-- =========================
     TASKS PAGE
========================= -->

<div
    id="tasks"
    class="page"
>

    <h1>Tasks</h1>

    <div
        class="task-list"
        id="taskContainer"
    ></div>

    <button
        class="add-button"
        onclick="addTask()"
    >
        ＋ Add Task
    </button>

</div>


<!-- =========================
     CHAT PAGE
========================= -->

<div
    id="chat"
    class="page"
>

    <h1>Chat</h1>

    <div class="chat-box">

        <div
            class="messages"
            id="messages"
        ></div>

        <div class="chat-input">

            <input
                id="chatInput"
                placeholder="Write a message..."
                onkeydown="
                    if(event.key === 'Enter')
                    sendMessage()
                "
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

</div>


</div>


<!-- =========================
     NOTE MODAL
========================= -->

<div
    class="modal-bg"
    id="noteModal"
>

<div class="modal">

    <h2 id="noteModalTitle">
        Add Note
    </h2>

    <input
        type="hidden"
        id="editingNoteId"
    >

    <label>
        Title
    </label>

    <input
        id="noteTitle"
        placeholder="Example: NCM 101"
    >

    <label>
        Content
    </label>

    <textarea
        id="noteContent"
        placeholder="Write your notes here..."
    ></textarea>

    <div class="modal-buttons">

        <button onclick="closeNoteModal()">
            Cancel
        </button>

        <button
            class="primary"
            onclick="saveNote()"
        >
            Save
        </button>

    </div>

</div>

</div>


<!-- =========================
     LOGIN MODAL
========================= -->

<div
    class="modal-bg"
    id="loginModal"
>

<div class="modal">

    <h2>🔒 Admin Access</h2>

    <p>
        Enter the administrator password.
    </p>

    <input
        type="password"
        id="adminPassword"
        placeholder="Password"
        onkeydown="
            if(event.key === 'Enter')
            login()
        "
    >

    <p
        id="loginError"
        style="color:#a34840;"
    ></p>

    <div class="modal-buttons">

        <button onclick="closeLogin()">
            Cancel
        </button>

        <button
            class="primary"
            onclick="login()"
        >
            Unlock
        </button>

    </div>

</div>

</div>


<script>

/* =================================================
   ADMIN PASSWORD
================================================= */

const ADMIN_PASSWORD = "supperlol123123";


/* =================================================
   DATA
================================================= */

let notes =
    JSON.parse(
        localStorage.getItem("bsn_notes")
    ) || [

        {
            id: Date.now(),
            title: "Welcome",
            content:
                "Welcome to the BSN 2A Notes website!"
        },

        {
            id: Date.now() + 1,
            title: "Class Notes",
            content:
                "Your class notes will go here."
        }

    ];


let tasks =
    JSON.parse(
        localStorage.getItem("bsn_tasks")
    ) || [];


let messages =
    JSON.parse(
        localStorage.getItem("bsn_messages")
    ) || [];


let isAdmin = false;


/* =================================================
   SAVE DATA
================================================= */

function saveData() {

    localStorage.setItem(
        "bsn_notes",
        JSON.stringify(notes)
    );

    localStorage.setItem(
        "bsn_tasks",
        JSON.stringify(tasks)
    );

    localStorage.setItem(
        "bsn_messages",
        JSON.stringify(messages)
    );

}


/* =================================================
   NOTES
================================================= */

function renderNotes() {

    const container =
        document.getElementById(
            "notesContainer"
        );

    container.innerHTML = "";

    if(notes.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No notes yet.
            </div>
        `;

        return;
    }


    notes.forEach(note => {

        const card =
            document.createElement("div");

        card.className = "note";

        card.draggable = isAdmin;

        card.dataset.id = note.id;


        card.innerHTML = `

            <h2>
                📌 ${escapeHTML(note.title)}
            </h2>

            <p>
                ${escapeHTML(note.content)}
            </p>

            <div class="note-buttons">

                <button
                    onclick="editNote(${note.id})"
                >
                    ✏️ Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteNote(${note.id})"
                >
                    🗑 Delete
                </button>

            </div>

        `;


        /* DRAG */

        card.addEventListener(
            "dragstart",
            dragStart
        );

        card.addEventListener(
            "dragover",
            dragOver
        );

        card.addEventListener(
            "drop",
            dropNote
        );


        container.appendChild(card);

    });

}


/* =================================================
   ADD / EDIT NOTE
================================================= */

function openNoteModal(id = null) {

    if(!isAdmin) return;


    document
        .getElementById("noteModal")
        .classList.add("show");


    if(id !== null) {

        const note =
            notes.find(
                n => n.id === id
            );

        document
            .getElementById("noteModalTitle")
            .textContent = "Edit Note";

        document
            .getElementById("editingNoteId")
            .value = id;

        document
            .getElementById("noteTitle")
            .value = note.title;

        document
            .getElementById("noteContent")
            .value = note.content;

    }

    else {

        document
            .getElementById("noteModalTitle")
            .textContent = "Add Note";

        document
            .getElementById("editingNoteId")
            .value = "";

        document
            .getElementById("noteTitle")
            .value = "";

        document
            .getElementById("noteContent")
            .value = "";

    }

}


function closeNoteModal() {

    document
        .getElementById("noteModal")
        .classList.remove("show");

}


function saveNote() {

    const title =
        document
            .getElementById("noteTitle")
            .value
            .trim();


    const content =
        document
            .getElementById("noteContent")
            .value
            .trim();


    const editingId =
        document
            .getElementById("editingNoteId")
            .value;


    if(!title) {

        alert("Please enter a title.");

        return;

    }


    if(editingId) {

        const note =
            notes.find(
                n =>
                    n.id ==
                    editingId
            );

        note.title = title;

        note.content = content;

    }

    else {

        notes.push({

            id: Date.now(),

            title: title,

            content: content

        });

    }


    saveData();

    renderNotes();

    closeNoteModal();

}


function editNote(id) {

    openNoteModal(id);

}


function deleteNote(id) {

    if(!isAdmin) return;


    if(
        !confirm(
            "Delete this note?"
        )
    ) return;


    notes =
        notes.filter(
            n => n.id !== id
        );


    saveData();

    renderNotes();

}


/* =================================================
   DRAG AND DROP
================================================= */

let draggedId = null;


function dragStart(event) {

    if(!isAdmin) return;

    draggedId =
        Number(
            event.currentTarget.dataset.id
        );

    event.currentTarget.classList.add(
        "dragging"
    );

}


function dragOver(event) {

    if(!isAdmin) return;

    event.preventDefault();

}


function dropNote(event) {

    if(!isAdmin) return;

    event.preventDefault();


    const targetId =
        Number(
            event.currentTarget.dataset.id
        );


    if(
        draggedId === targetId
    ) return;


    const from =
        notes.findIndex(
            n => n.id === draggedId
        );


    const to =
        notes.findIndex(
            n => n.id === targetId
        );


    const moved =
        notes.splice(from, 1)[0];


    notes.splice(
        to,
        0,
        moved
    );


    saveData();

    renderNotes();

}


/* =================================================
   TASKS
================================================= */

function renderTasks() {

    const container =
        document.getElementById(
            "taskContainer"
        );

    container.innerHTML = "";


    if(tasks.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No tasks yet.
            </div>
        `;

        return;

    }


    tasks.forEach(task => {

        const element =
            document.createElement("div");

        element.className =
            "task" +
            (
                task.done
                ? " done"
                : ""
            );


        element.innerHTML = `

            <input
                type="checkbox"
                ${
                    task.done
                    ? "checked"
                    : ""
                }
                onchange="
                    toggleTask(${task.id})
                "
            >

            <span class="task-text">
                ${escapeHTML(task.text)}
            </span>

            <div class="task-actions">

                <button
                    onclick="
                        deleteTask(${task.id})
                    "
                >
                    🗑
                </button>

            </div>

        `;


        container.appendChild(element);

    });

}


function addTask() {

    if(!isAdmin) return;


    const text =
        prompt(
            "Enter task:"
        );


    if(!text) return;


    tasks.push({

        id: Date.now(),

        text: text,

        done: false

    });


    saveData();

    renderTasks();

}


function toggleTask(id) {

    if(!isAdmin) {

        renderTasks();

        return;

    }


    const task =
        tasks.find(
            t => t.id === id
        );


    task.done =
        !task.done;


    saveData();

    renderTasks();

}


function deleteTask(id) {

    if(!isAdmin) return;


    tasks =
        tasks.filter(
            t => t.id !== id
        );


    saveData();

    renderTasks();

}


/* =================================================
   CHAT
================================================= */

function renderMessages() {

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";


    messages.forEach(message => {

        const element =
            document.createElement("div");

        element.className = "message";

        element.textContent =
            message;

        container.appendChild(element);

    });


    container.scrollTop =
        container.scrollHeight;

}


function sendMessage() {

    const input =
        document.getElementById(
            "chatInput"
        );


    const text =
        input.value.trim();


    if(!text) return;


    messages.push(text);


    saveData();

    renderMessages();


    input.value = "";

}


/* =================================================
   ADMIN
================================================= */

function toggleAdmin() {

    if(isAdmin) {

        logout();

    }

    else {

        document
            .getElementById("loginModal")
            .classList.add("show");

    }

}


function login() {

    const password =
        document
            .getElementById(
                "adminPassword"
            )
            .value;


    if(
        password ===
        ADMIN_PASSWORD
    ) {

        isAdmin = true;

        document.body
            .classList.add("admin");


        document
            .getElementById("lockButton")
            .textContent =
            "🔓 Admin";


        document
            .getElementById("loginModal")
            .classList.remove("show");


        document
            .getElementById("adminPassword")
            .value = "";


        renderNotes();

        renderTasks();

    }

    else {

        document
            .getElementById("loginError")
            .textContent =
            "Incorrect password.";

    }

}


function logout() {

    isAdmin = false;


    document.body
        .classList.remove("admin");


    document
        .getElementById("lockButton")
        .textContent =
        "🔒 View Only";


    renderNotes();

    renderTasks();

}


/* =================================================
   PAGE NAVIGATION
================================================= */

function showPage(page, button) {

    document
        .querySelectorAll(".page")
        .forEach(
            p =>
                p.classList.remove(
                    "active"
                )
        );


    document
        .getElementById(page)
        .classList.add("active");


    document
        .querySelectorAll(".menu")
        .forEach(
            m =>
                m.classList.remove(
                    "active"
                )
        );


    button.classList.add("active");

}


/* =================================================
   SECURITY / HTML
================================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =================================================
   MODAL CLOSE
================================================= */

document
    .querySelectorAll(".modal-bg")
    .forEach(modal => {

        modal.addEventListener(
            "click",
            event => {

                if(
                    event.target ===
                    modal
                ) {

                    modal.classList.remove(
                        "show"
                    );

                }

            }
        );

    });


/* =================================================
   START
================================================= */

renderNotes();

renderTasks();

renderMessages();

</script>

</body>

</html>
